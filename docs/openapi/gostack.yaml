        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/admin/games/{game}/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/Game'
      - name: id
        in: path
        required: true
        description: Ids not matching the pattern get 404.
        schema: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'}
    put:
      operationId: opsAdminPutTask
      tags: [ops]
      x-gostack-module: ops
      summary: Create or replace a task (admin)
      description: Body limit 16 KiB. Daily periods roll at local midnight, weekly at ISO-week boundaries in the task timezone.
      security: [{adminKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OpsTaskInput'}
      responses:
        '200':
          description: Stored task.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpsTask'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '503': {$ref: '#/components/responses/Overloaded'}
    delete:
      operationId: opsAdminDeleteTask
      tags: [ops]
      x-gostack-module: ops
      summary: Delete a task and its progress (admin)
      security: [{adminKey: []}]
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Overloaded'}
