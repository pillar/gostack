  /v1/match/rooms/claim:
    post:
      operationId: matchClaimRoom
      tags: [match]
      x-gostack-module: match
      summary: Battle server claims the oldest unassigned room
      description: |
        Claims the oldest `open` room of the key's tenant (optionally filtered by
        game and queue), sets it `active` with a lease of `game.match.lease_ttl`
        (default 30s) and returns a random room `token` (256 bits; only its
        SHA-256 is stored) plus the fencing `epoch` (per-game counter, only
        grows). The room is bound to the claiming API key: heartbeat, member
        state and result need that same key and the token. Not under a game
        route: no CORS. Honours `Idempotency-Key`
        (scoped to the API key). Body limit 4 KiB.

        Errors: `400 invalid_request` (`server_id` missing/invalid, invalid
        `game_id`/`queue`, `connection` not a JSON object ≤ 1024 bytes),
        `409 idempotency_key_reused`.
      security:
        - battleKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MatchClaimRequest'}
      responses:
        '200':
          description: Room claimed.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MatchClaimedRoom'}
        '204':
          description: No room is waiting for a server.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '503': {$ref: '#/components/responses/Overloaded'}

  /v1/match/rooms/{room}/heartbeat:
    post:
      operationId: matchRoomHeartbeat
      tags: [match]
      x-gostack-module: match
      summary: Extend the room lease
      description: |
        Extends the lease by `lease_ttl` (send about every `lease_ttl_ms / 3`).
        Fenced: the API key must be the one that claimed the room and the
        token the room's current token (`409 stale_token` otherwise).

        Errors: `404 not_found` (room unknown or of another tenant),
        `409 stale_token`, `409 room_abandoned` (lease expired; the room is
        marked abandoned in the same call), `409 room_settled`.
      security:
        - battleKey: []
      parameters:
        - name: room
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MatchTokenRequest'}
      responses:
        '200':
          description: Lease extended.
          content:
            application/json:
              schema:
                type: object
                required: [room_id, lease_until]
                properties:
                  room_id: {type: string}
                  lease_until: {type: integer, format: int64}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '503': {$ref: '#/components/responses/Overloaded'}

  /v1/match/rooms/{room}/members/{player}/state:
    post:
      operationId: matchRoomMemberState
      tags: [match]
      x-gostack-module: match
      summary: Report a member leaving or rejoining the battle
      description: |
        The slot stays reserved; the battle server decides how a leaver is
        scored. Fenced like heartbeat.

        Errors: `400 invalid_request` (state not `connected`/`left`),
        `404 not_found` (room, or player not a member), `409 stale_token`,
        `409 room_abandoned`, `409 room_settled`.
      security:
        - battleKey: []
      parameters:
        - name: room
          in: path
          required: true
          schema: {type: string}
        - name: player
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, state]
              properties:
                token:
                  type: string
                  description: Room token from claim; a token that is not the room's current token, or a key other than the claiming key, gets `409 stale_token`.
                state:
                  type: string
                  enum: [connected, left]
      responses:
        '200':
          description: State recorded.
          content:
            application/json:
              schema:
                type: object
                required: [room_id, player_id, state]
                properties:
                  room_id: {type: string}
                  player_id: {type: string}
                  state:
                    type: string
                    enum: [connected, left]
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '503': {$ref: '#/components/responses/Overloaded'}

  /v1/match/rooms/{room}/result:
    post:
      operationId: matchRoomResult
      tags: [match]
      x-gostack-module: match
      summary: Settle the room with authoritative results
      description: |
        In one transaction: grants per player via the ledger (source
        `match:<room>:<player>`), optional scores on the queue's board with
        leaderboard rules (range, quarantine, best/sum, asc/desc, current
        season), the settlement row, room → `settled`, tickets → `done`. Any
        invalid entry rolls back everything. Idempotent per room: the identical
        body (current token) returns the stored response with
        `Idempotent-Replayed: true`; `Idempotency-Key` is not used. Body limit
        256 KiB.

        Errors: `400 invalid_request` (0 or > 64 entries, duplicate/invalid
        player ids, > 8 grant assets, amounts outside [0, 1e9], score outside the
        board range), `400 not_a_member`, `400 no_board` (score given but the
        queue has no board), `404 not_found`, `409 stale_token`,
        `409 room_abandoned`, `409 already_settled` (settled with a different
        body), `409 board_unavailable`, `409 stack_limit`.
      security:
        - battleKey: []
      parameters:
        - name: room
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MatchResultRequest'}
      responses:
        '200':
          description: Settled (or replay of the identical settlement).
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MatchResultResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '503': {$ref: '#/components/responses/Overloaded'}

  /v1/games/{game}/realtime:
    get:
      operationId: realtimeConnect
      tags: [realtime]
      x-gostack-module: realtime
      summary: WebSocket upgrade for the realtime gateway
      description: |
        WebSocket (RFC 6455, version 13) upgrade. The message protocol (welcome,
        resume/resumed/resume_failed, ack, ping/pong, application messages,
        error frames, close codes 4001/4003/4008/4009/4012/4029) is specified in
        `docs/api/realtime.md`; OpenAPI cannot express it.

        Profile `lite`: connections, sequence numbers and replay buffers live
        in process memory (single instance). Profile `scale` requires
        `game.realtime.bus: postgres`: PostgreSQL assigns per-player sequence
        numbers and keeps the replay window, so Send/Broadcast and resume work
        across instances (ADR-0005).

        Authentication, one of:
        1. Non-browser clients: `Authorization: Bearer <access_token>` on the
           upgrade request (validated before upgrading).
        2. Browsers: upgrade without credentials, then send
           `{"type":"auth","token":"<access_token>"}` as the first message within
           `game.realtime.auth_timeout` (default 5s); failure closes with 4001
           (4003 for a token of another game).
        Tokens are never accepted in the URL. The session is re-checked every
        `session_recheck` (default 1 min); logout/expiry closes with 4001.

        Pre-upgrade checks, in order, answer with the standard error envelope:
        unknown game `404 not_found`; disabled game `403 forbidden`; a query
        parameter named `token`, `access_token`, `authorization`, `auth` or
        `bearer` → `400 token_in_url`; an `Origin` not in the game's
        `allowed_origins` → `403 origin_not_allowed` (requests without `Origin`
        pass); malformed/invalid/expired `Authorization` → `401 unauthorized`;
        token of another game or disabled game → `403 forbidden`;
        `max_connections` reached (including unauthenticated connections) →
        `503 overloaded`. Requests that pass these checks but are not a valid
        WebSocket handshake are rejected by the WebSocket library with a
        `text/plain` body (`426` missing Upgrade/Connection, `400` bad
        `Sec-WebSocket-Version`/`Sec-WebSocket-Key`).

        The upgraded connection does not hold an HTTP concurrency slot and is
        not bound by the HTTP request timeout.
      security:
        - {}
        - gameSession: []
      parameters:
        - $ref: '#/components/parameters/Game'
        - name: Upgrade
          in: header
          required: true
          schema:
            type: string
            enum: [websocket]
        - name: Connection
          in: header
          required: true
          description: Must contain `Upgrade`.
          schema:
            type: string
        - name: Sec-WebSocket-Version
          in: header
          required: true
          schema:
            type: string
            enum: ['13']
        - name: Sec-WebSocket-Key
          in: header
          required: true
          description: Base64 of 16 random bytes.
          schema:
            type: string
      responses:
        '101':
          description: Switching Protocols. The server then sends `welcome` (after header auth immediately, otherwise after the `auth` message).
          headers:
            Upgrade:
              schema:
                type: string
                enum: [websocket]
            Connection:
              schema:
                type: string
                enum: [Upgrade]
            Sec-WebSocket-Accept:
              schema:
                type: string
        '400':
          description: '`token_in_url` (envelope), or an invalid WebSocket handshake (`text/plain`).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
            text/plain:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: '`forbidden` (disabled game, token of another game) or `origin_not_allowed`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '404': {$ref: '#/components/responses/NotFound'}
        '426':
          description: 'Not a WebSocket upgrade request (missing `Upgrade: websocket` / `Connection: Upgrade`).'
          content:
            text/plain:
              schema: {type: string}
        '503': {$ref: '#/components/responses/Overloaded'}

  /v1/games/{game}/social/profile:
    parameters:
