  /v1/web/pages/{id}/publish:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      operationId: webPublishPage
      tags: [web]
      x-gostack-module: web
      summary: Publish now or schedule
      description: |
        `revision` 0 = current draft. `at` (unix ms) in the future schedules a `web.publish` job (status `scheduled`); otherwise the page is published now. Publishing the live revision again is a no-op.
