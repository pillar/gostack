  /v1/games/{game}/tasks/{id}/claim:
    post:
      operationId: opsClaimTask
      tags: [ops]
      x-gostack-module: ops
      summary: Claim a completed task
      description: |
        Once per period (ledger source key `task:<id>:<period_key>:<player>`). Request body ignored.
        A period also counts as claimed when the player's last claim instant
        falls in the current period computed in the task's CURRENT timezone, so
        changing the timezone does not reopen a period already paid.
        Errors: 404 unknown task; 403 `forbidden` (gating event inactive); 409 `not_completed`;
        409 `already_claimed`; 409 `idempotency_key_reused`.
      security: [{gameSession: []}]
      parameters:
        - $ref: '#/components/parameters/Game'
        - name: id
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'}
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Claimed.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpsTaskClaimResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Overloaded'}
