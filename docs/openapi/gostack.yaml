      responses:
        '200':
          description: Not blocked.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocialBlockResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/games/{game}/invites:
    parameters:
      - $ref: '#/components/parameters/Game'
    get:
      operationId: socialListInvites
      tags: [social]
      x-gostack-module: social
      summary: List the caller's invite codes with attribution counts
      security: [{gameSession: []}]
      responses:
        '200':
          description: Invite codes.
          content:
            application/json:
              schema:
                type: object
                required: [invites]
                properties:
                  invites:
                    type: array
                    items: {$ref: '#/components/schemas/SocialInvite'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: socialCreateInvite
      tags: [social]
      x-gostack-module: social
      summary: Create an invite code
      description: "No body is read. Rate limited per player. `409 invite_limit` when the caller has MaxInvites (default 5) codes."
      security: [{gameSession: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: {type: string, pattern: '^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{8}$'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/games/{game}/invites/claim-pending:
    parameters:
      - $ref: '#/components/parameters/Game'
    post:
      operationId: socialClaimPendingInvite
      tags: [social]
      x-gostack-module: social
      summary: Collect invite grants that were pending because the caller was a guest
      description: |
        No body is read. Rate limited per player. Pays `InviterGrant` and
        `InviteeGrant` of the caller's attribution exactly once (conditional
        update of the attribution plus the unique ledger source keys
        `invite:<invitee>:invitee|inviter`), once the caller has a verified
        platform identity (`POST /auth/bind` or a platform login).
        Errors: `404 not_found` (caller accepted no invite),
        `403 identity_required` (caller is still guest-only),
        `409 already_paid`, `429 rate_limited`.
      security: [{gameSession: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Grants paid.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema:
                type: object
                required: [paid, grants]
                properties:
                  paid: {type: boolean, const: true}
                  grants: {$ref: '#/components/schemas/Grants'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/games/{game}/invites/{code}/accept:
    parameters:
      - $ref: '#/components/parameters/Game'
      - name: code
        in: path
        required: true
        description: Invite code, case-insensitive (upper-cased before lookup).
        schema: {type: string, pattern: '^[A-Za-z0-9]{4,16}$'}
    post:
      operationId: socialAcceptInvite
      tags: [social]
      x-gostack-module: social
      summary: Attribute the caller (a new player) to the inviter
      description: |
        No body is read. Rate limited per player. The attribution is always
        recorded. Grants (`InviteeGrant` to the caller, `InviterGrant` to the
        inviter, source keys `invite:<invitee>:invitee|inviter`) are written in
        the same transaction only when the caller has a verified platform
        identity (any `player_identities` provider other than `guest`);
        otherwise `grants_pending` is true and the caller collects them with
        `POST /invites/claim-pending` after binding a platform identity.
        Errors: `404 not_found` (unknown code or blocked pair), `400 self_invite`,
        `403 not_new_player` (caller older than the invite window, default 24h),
        `409 already_attributed`, `409 invite_full`, `429 rate_limited`.
      security: [{gameSession: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Attributed.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema:
                type: object
                required: [attributed, grants_pending, grants]
                properties:
                  attributed: {type: boolean, const: true}
                  grants_pending: {type: boolean, description: 'True when the caller is a guest: no grant was paid yet.'}
                  grants:
                    description: Invitee grant paid now; `{}` when pending or none is configured.
                    $ref: '#/components/schemas/Grants'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/games/{game}/shares:
    parameters:
      - $ref: '#/components/parameters/Game'
    post:
      operationId: socialCreateShare
      tags: [social]
      x-gostack-module: social
      summary: Create a share for attribution
      description: Body limit 4096 bytes; rate limited per player.
      security: [{gameSession: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SocialShareCreate'}
      responses:
        '201':
          description: Created.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema:
                type: object
                required: [share_id]
                properties:
                  share_id: {$ref: '#/components/schemas/SocialShareId'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/games/{game}/shares/{id}:
    parameters:
      - $ref: '#/components/parameters/Game'
      - name: id
        in: path
        required: true
        description: Share id. Malformed ids get `404 not_found`.
        schema: {$ref: '#/components/schemas/SocialShareId'}
    get:
      operationId: socialGetShare
      tags: [social]
      x-gostack-module: social
      summary: Read one of the caller's shares with its distinct-open count
      description: Only the sharer can read it; others get 404.
      security: [{gameSession: []}]
      responses:
        '200':
          description: Share.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocialShare'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/games/{game}/shares/{id}/open:
    parameters:
      - $ref: '#/components/parameters/Game'
      - name: id
        in: path
        required: true
        description: Share id. Malformed ids get `404 not_found`.
        schema: {$ref: '#/components/schemas/SocialShareId'}
    post:
      operationId: socialOpenShare
      tags: [social]
      x-gostack-module: social
      summary: Record that the caller opened another player's share
      description: |
        No body is read; no reward is granted. One recorded open per player
        (`first_open` false on later opens). Errors: `400 own_share`,
        `404 not_found` (unknown share or blocked pair).
      security: [{gameSession: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Opened.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocialShareOpen'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Overloaded'}

  /v1/auth/signup:
    post:
      operationId: webauthSignup
      tags: [webauth]
      x-gostack-module: webauth
      summary: Create a web user in the module tenant and log in
      description: |
        Requires `Content-Type: application/json` (`415 unsupported_media_type`)
        and passes the origin check (`Origin` same host or in
        `auth.web.allowed_origins`, `Sec-Fetch-Site` same-origin/none; else
        `403 csrf_failed`). Rate limited per IP (`ip_rate_per_minute`; IPv6 per /64).
        Sets the session cookie and `Cache-Control: no-store`.
        Errors: `403 signup_disabled` (`allow_signup: false`), `403 csrf_failed`,
        `400 invalid_email`, `400 invalid_password`, `409 email_taken`,
        `429 rate_limited`, `503 overloaded` (hashing slots busy until the request deadline, or write queue full).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebAuthCredentials'}
      responses:
        '201':
          description: Created and logged in.
          headers:
            Set-Cookie:
              description: '`gostack_session` / `__Host-gostack_session` = `gws_...`; HttpOnly; SameSite=Lax; Path=/; Max-Age=session_ttl (Secure in production).'
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebAuthSession'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415':
          description: Content-Type is not application/json (`unsupported_media_type`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/auth/login:
    post:
      operationId: webauthLogin
      tags: [webauth]
      x-gostack-module: webauth
      summary: Log in with email and password
      description: |
        Same content-type and origin checks as signup. Rate limited per IP and
        per account (`account_rate_per_minute`). Unknown account, wrong password
        and malformed email/password length all return the same
        `401 invalid_credentials` after one Argon2id verification. Any session
        cookie sent is revoked (session fixation) and a new one is set.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebAuthCredentials'}
      responses:
        '200':
          description: Logged in.
          headers:
            Set-Cookie:
              description: New session cookie (see signup).
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebAuthSession'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          description: '`invalid_credentials`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415':
          description: Content-Type is not application/json (`unsupported_media_type`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Overloaded'}
