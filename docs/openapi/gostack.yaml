      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                revision: {type: integer, format: int64, minimum: 0}
                at: {type: integer, format: int64, description: Publish time (unix ms); 0 or past = now.}
      responses:
        '200':
          description: Page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
