        in: path
        required: true
        description: Other player's id. Malformed ids get `404 not_found` (`player not found`).
        schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
    post:
      operationId: socialBlock
      tags: [social]
      x-gostack-module: social
      summary: Block a player
      description: |
        Idempotent (blocking again succeeds). In one transaction records the
        block and removes friendship and pending requests in both directions.
        Errors: `400 invalid_request` (self), `404 not_found` (unknown player),
        `409 block_limit`.
      security: [{gameSession: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Blocked.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocialBlockResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Overloaded'}
    delete:
      operationId: socialUnblock
      tags: [social]
      x-gostack-module: social
      summary: Unblock a player (succeeds when no block exists)
      security: [{gameSession: []}]
