  /v1/games/{game}/match/tickets:
    post:
      operationId: matchCreateTicket
      tags: [match]
      x-gostack-module: match
      summary: Create a matchmaking ticket
      description: |
        Creates a `waiting` ticket in the queue. A player has at most one
        waiting or matched ticket; a stale ticket (TTL elapsed, room lease lost)
        never blocks a new one. Rate limited per player
        (`game.match.tickets_per_minute`, default 60). Body limit 2 KiB.

        Errors: `400 invalid_request` (`attributes.rating` outside ±1,000,000,
        unknown fields), `404 not_found` (queue), `409 ticket_active`,
        `409 idempotency_key_reused`, `429 rate_limited`.
      security:
        - gameSession: []
      parameters:
        - $ref: '#/components/parameters/Game'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MatchCreateTicketRequest'}
      responses:
        '201':
          description: Ticket created (or replayed).
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MatchCreatedTicket'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Overloaded'}

  /v1/games/{game}/match/tickets/{id}:
    parameters:
      - $ref: '#/components/parameters/Game'
      - name: id
        in: path
        required: true
        description: Ticket id (`tkt_...`).
        schema: {type: string}
    get:
      operationId: matchGetTicket
      tags: [match]
      x-gostack-module: match
      summary: Get the caller's ticket (poll for match / rejoin)
      description: |
        Own tickets only (others are `404`). `expired` and `abandoned` are
        reported as soon as time passes. Once matched, `room` is included;
        `room.connection` is `null` until a battle server claims the room.
      security:
        - gameSession: []
      responses:
        '200':
          description: Ticket.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MatchTicket'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: matchCancelTicket
      tags: [match]
      x-gostack-module: match
      summary: Cancel a waiting ticket
      description: |
        Cancels a `waiting` ticket; cancelling an already cancelled ticket
        succeeds again. Honours `Idempotency-Key`.

        Errors: `404 not_found`, `409 already_matched` (ticket is in a room),
        `409 ticket_closed` (expired, abandoned or done).
      security:
        - gameSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Cancelled.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema:
                type: object
                required: [ticket_id, status]
                properties:
                  ticket_id: {type: string}
                  status:
                    type: string
                    enum: [cancelled]
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Overloaded'}

  /v1/admin/games/{game}/match/queues/{queue}:
    put:
      operationId: matchAdminPutQueue
      tags: [match]
      x-gostack-module: match
      summary: Create or replace a matchmaking queue
      description: |
        A ticket may match players whose rating differs by at most
        `rating_window + widen_per_sec × seconds_waited` (narrowest window in the
        group; `max_window > 0` caps it). Body limit 4 KiB.

        Errors: `400 invalid_request` (invalid queue id, missing required field,
        out-of-range values, `board` not defined in the current game config).
      security:
        - adminKey: []
      parameters:
        - $ref: '#/components/parameters/Game'
        - name: queue
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MatchQueueRequest'}
      responses:
        '200':
          description: Stored queue.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MatchQueue'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '503': {$ref: '#/components/responses/Overloaded'}

