      tags: [webauth]
      x-gostack-module: webauth
      summary: Delete the current session
      description: Requires the session cookie, the origin check and `X-CSRF-Token` (`403 csrf_failed`). No body is read. Clears the cookie (`Max-Age=0`).
      security: [{webSession: [], csrfToken: []}]
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Overloaded'}
