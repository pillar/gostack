        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/games/{game}/friends/requests/{player_id}/decline:
    parameters:
      - $ref: '#/components/parameters/Game'
      - name: player_id
        in: path
        required: true
        description: Other player's id. Malformed ids get `404 not_found` (`player not found`).
        schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
    post:
      operationId: socialDeclineFriendRequest
      tags: [social]
      x-gostack-module: social
      summary: Decline an incoming request from `player_id`
      description: No body is read. 404 `not_found` when no such pending request exists.
      security: [{gameSession: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
