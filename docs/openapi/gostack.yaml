  /v1/games/{game}/mail/{id}/claim:
    post:
      operationId: opsClaimMail
      tags: [ops]
      x-gostack-module: ops
      summary: Claim mail attachment
      description: |
        Pays the attachment once per (mail, player) via the ledger (source key `mail:<id>:<player>`).
        The request body is ignored. Errors: 404 not visible/expired/deleted; 409 `no_attachment`;
        409 `already_claimed`; 409 `idempotency_key_reused`.
      security: [{gameSession: []}]
