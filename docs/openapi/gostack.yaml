          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Results.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExpResults'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/games/{game}/iap/orders:
    post:
      operationId: commerceCreateOrder
      tags: [commerce]
      x-gostack-module: commerce
      summary: Issue an IAP order and its app_account_token
      description: |
        Creates an order in state `created` bound to the session player and the
        product, and returns a random UUID `app_account_token` to pass to StoreKit
        as `appAccountToken`. A store transaction carrying that token can only be
        delivered to this player. Body limit 1 KiB.

        Errors: `400 invalid_request` (bad/unknown JSON, invalid `product_id`),
        `404 not_found` (product not in the catalog), `409 idempotency_key_reused`.
      security:
        - gameSession: []
      parameters:
        - $ref: '#/components/parameters/Game'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommerceCreateOrderRequest'}
      responses:
        '201':
          description: 'Order created (or replayed with `Idempotent-Replayed: true`).'
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommerceCreatedOrder'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '503': {$ref: '#/components/responses/Overloaded'}

  /v1/games/{game}/iap/orders/{order}:
    get:
      operationId: commerceGetOrder
      tags: [commerce]
      x-gostack-module: commerce
      summary: Read one of the session player's orders
      description: |
        Returns the order if it belongs to the session player (404 otherwise).
        Clients poll it after paying with WeChat Pay, where delivery is driven by
        the payment notification.
      security:
        - gameSession: []
      parameters:
        - $ref: '#/components/parameters/Game'
        - name: order
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommerceOrderResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/games/{game}/iap/wechatpay/prepay:
    post:
      operationId: commerceWeChatPrepay
      tags: [commerce]
      x-gostack-module: commerce
      summary: Create the WeChat Pay JSAPI order for a created order
      description: |
        WeChat Pay API v3 JSAPI / mini-program payment (not the WeChat mini-game
        virtual payment API, which is not implemented). Fixes provider, store
        product (`provider_product_ids.wechatpay`) and price (config `prices`,
        fen) on the order in a write transaction, then calls
        `POST /v3/pay/transactions/jsapi` outside any transaction (merchant
        `WECHATPAY2-SHA256-RSA2048` signature, `out_trade_no` = token without
        dashes, `payer.openid` = the player's `wechat` login identity,
        `time_expire` = order creation + 2h), then stores `prepay_id`. A repeat
        returns the stored `prepay_id` with fresh payment parameters.

        Errors: `400 invalid_request`, `404 not_found` (order not the player's),
        `404 provider_not_configured`, `409 invalid_state` (order not `created`),
        `409 order_expired`, `409 wechat_identity_required`,
        `409 prepay_conflict` (WeChat Pay `OUT_TRADE_NO_USED`),
        `422 product_not_mapped` (no wechatpay mapping or price),
        `503 store_unavailable` (WeChat Pay error or unreachable).
      security:
        - gameSession: []
      parameters:
        - $ref: '#/components/parameters/Game'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommerceWeChatPrepayRequest'}
      responses:
        '200':
          description: Payment parameters for wx.requestPayment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommerceWeChatPrepay'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: Product has no wechatpay mapping or price (`product_not_mapped`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '503': {$ref: '#/components/responses/Overloaded'}

  /v1/games/{game}/iap/{provider}/verify:
    post:
      operationId: commerceVerifyPurchase
      tags: [commerce]
      x-gostack-module: commerce
      summary: Verify a client-submitted store transaction and deliver it once
      description: |
        Verifies a StoreKit 2 / App Store Server API `signedTransactionInfo`
        (ES256 JWS whose x5c chain must end at the configured Apple root CA, with
        Apple marker OIDs; bundle id and environment checked per game) before any
        database transaction, then delivers the product grants × `quantity` in one
        write transaction (ledger source `iap:<provider>:<transactionId>`).
        Idempotent by transaction: a repeat by the same player returns the same
        order with `replayed: true` and grants nothing more. `Idempotency-Key` is
        not used. Body limit 128 KiB.

        `google`: body `{product_id, purchase_token}`; the server calls the Google
        Play Developer API purchases.products.get (service-account OAuth2) before
        any database transaction, binds `obfuscatedExternalAccountId` to the
        order's `app_account_token`, and enqueues a consume/acknowledge job with
        the delivery. `wechatpay` has no client proof (400; delivery comes from
        the payment notification). See docs/api/commerce.md.

        Errors: `400 invalid_signature`, `400 bundle_mismatch`,
        `400 environment_mismatch`, `400 invalid_request` (missing
        `signed_transaction`; transaction without `appAccountToken` while unbound
        transactions are disabled), `403 unknown_app_account_token`,
        `403 transaction_owned_by_other_player`, `404 provider_not_configured`
        (provider unknown or not configured for this game),
        `409 transaction_refunded`, `409 transaction_already_used` (transaction
        belongs to another game), `409 product_mismatch`, `409 stack_limit`,
        `422 product_not_mapped`; Google: `400 invalid_purchase`,
        `400 test_purchase_rejected`, `409 purchase_pending`,
        `503 store_unavailable`.
      security:
        - gameSession: []
      parameters:
        - $ref: '#/components/parameters/Game'
        - name: provider
          in: path
          required: true
          description: IAP provider name.
          schema:
            type: string
            enum: [apple, google, wechatpay]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommerceVerifyRequest'}
      responses:
        '200':
          description: Delivered (or already delivered to this player).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommerceVerifyResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: Store product id is not mapped to a product of this game (`product_not_mapped`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '503': {$ref: '#/components/responses/Overloaded'}

  /v1/games/{game}/callbacks/{provider}:
    post:
      operationId: commerceIapCallback
      tags: [commerce]
      x-gostack-module: commerce
      summary: Store server notification (App Store Server Notifications V2, Google Play RTDN, WeChat Pay)
      description: |
        Public endpoint called by the store. Trust comes only from the signature:
        the outer `signedPayload` JWS and the embedded `signedTransactionInfo` are
        both verified offline (ES256, x5c chain to the configured Apple root CA,
        Apple marker OIDs), together with bundle id and environment for this game,
        before any database transaction. Unverified callbacks are not recorded.

        Verified events are deduplicated in an inbox by (game, provider,
        `notificationUUID`). `ONE_TIME_CHARGE` delivers to the token's player
        when the `appAccountToken` is known, otherwise stores the order as `paid`
        awaiting client verify; `REFUND`/`REVOKE` (or a transaction with
        `revocationDate`) reverses grants as far as balances allow (remainder →
        `refund_shortfall`). Other types are verified and `ignored`.
        A re-delivery of a processed/ignored event returns the recorded outcome
        with `duplicate: true`. A verified event that hits a business error is
        recorded `failed`, its writes are rolled back and the error is returned so
        the store retries. Body limit 256 KiB (JSON is not strictly decoded).

        Errors: `400 invalid_request` (body is not `{"signedPayload": "..."}`),
        `400 invalid_signature`, `400 bundle_mismatch`, `400 environment_mismatch`,
        `404 provider_not_configured`, `409 product_mismatch`, `409 stack_limit`,
        `422 product_not_mapped`.

        `google`: Cloud Pub/Sub push of a Real-time developer notification;
        `Authorization: Bearer <OIDC JWT>` must be RS256-signed by a key of
        Google's JWKS with `iss` accounts.google.com, the configured `aud`, the
        configured push service account `email` and `email_verified`
        (`401 invalid_signature` otherwise). Event id = `message.messageId`.
        Voided one-time purchases (full refunds) reverse grants;
        `ONE_TIME_PRODUCT_PURCHASED` is re-checked with purchases.products.get;
        other types are ignored. Extra errors: `400 package_mismatch`,
        `503 store_unavailable`, `503 key_fetch_failed`.

        `wechatpay`: WeChat Pay API v3 notification. `Wechatpay-Signature` is
        RSA-SHA256 over "timestamp\nnonce\nbody\n" with the platform key named
        by `Wechatpay-Serial`; the timestamp must be within `max_skew` (default
        5 min); `resource` is decrypted with AEAD_AES_256_GCM and the APIv3 key.
        `TRANSACTION.SUCCESS` delivers to the order named by `out_trade_no` after
        checking mchid, appid and amount; a full `REFUND.SUCCESS` reverses.
        Success answer: `204` without body. Failure: 4xx/5xx with
        `{"code":"FAIL","message":<error code>}` so WeChat Pay retries. Errors:
        `401 invalid_signature`, `400 invalid_signature` (resource does not
        decrypt), `400 merchant_mismatch`, `400 app_mismatch`,
        `409 amount_mismatch`.
      security: []
      parameters:
        - $ref: '#/components/parameters/Game'
        - name: provider
          in: path
          required: true
          description: IAP provider name.
          schema:
            type: string
            enum: [apple, google, wechatpay]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommerceAppleNotification'}
      responses:
        '200':
          description: Event processed, ignored, or a duplicate of a recorded event.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommerceCallbackResult'}
        '204':
          description: WeChat Pay notification accepted (processed, ignored or duplicate).
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: Store product id is not mapped (`product_not_mapped`); recorded as failed, the store should retry.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '503': {$ref: '#/components/responses/Overloaded'}

  /v1/games/{game}/ads/{placement}/intent:
    post:
      operationId: commerceAdIntent
      tags: [commerce]
      x-gostack-module: commerce
      summary: Issue a single-use rewarded-ad intent token
      description: |
        Returns an opaque single-use token to pass to the ad SDK as server-side
        verification custom data (AdMob `custom_data`, or HMAC `token`). The
        reward callback is credited to this player only. Valid for
        `game.commerce.ad_intent_ttl` (default 24h); at most 20 unused,
        unexpired tokens per player. The request body is ignored. Every call
        issues a new token (no Idempotency-Key).

        Errors: `404 not_found` (placement unknown or invalid id),
        `409 ad_cap_reached` (daily cap of credited rewards reached for this
        placement, UTC day), `409 too_many_intents`.
      security:
        - gameSession: []
      parameters:
        - $ref: '#/components/parameters/Game'
        - name: placement
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
      responses:
        '201':
          description: Intent created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommerceAdIntent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Overloaded'}

  /v1/games/{game}/callbacks/ads/{provider}:
    parameters:
      - $ref: '#/components/parameters/Game'
      - name: provider
        in: path
        required: true
        description: Ad network name as configured under `game.commerce.ads` (kind `admob` or `hmac`).
        schema:
          type: string
    get:
      operationId: commerceAdCallbackGet
      tags: [commerce]
      x-gostack-module: commerce
      summary: Rewarded-ad server-side verification callback (query string)
      description: |
        Public endpoint called by the ad network. Trust comes only from the
        signature, verified before any database transaction:
        - `admob`: ECDSA P-256/SHA-256 over the raw query string up to
          `&signature=`; `signature` is web-safe base64 DER, `key_id` selects a key
          from Google's published key set (fetched/cached outside the
          transaction). Only signed parameters are trusted: `transaction_id` is
          the event id, `custom_data` (or `user_id` when empty) is the intent
          token. `reward_amount`/`reward_item` are ignored; grants come from the
          placement.
        - `hmac`: parameters `event_id`, `token`, `ts` (unix seconds, within
          ±`max_skew`, default 1h) and `sig = hex(HMAC-SHA256(secret, canonical))`
          where canonical is every parameter except `sig`, sorted by name, joined
          as `name=value` with `&` (decoded values). Repeated parameters are
          rejected. Secret per game.

        The player comes from the intent token, never from a callback field.
        Credited once per (game, network, event id). A verified callback that
        cannot be credited is answered `200` with `status: "ignored"` and
        `reason` one of `unknown_token`, `token_used`, `token_expired`,
        `placement_removed`, `daily_cap_reached`. Query limit 16 KiB; event id
        and token ≤ 128 characters.

        Errors: `401 invalid_signature`, `400 invalid_request`,
        `404 provider_not_configured` (unknown network, or no HMAC secret for
        this game), `413 payload_too_large`, `503 key_fetch_failed`.
      security: []
      parameters:
        - {name: transaction_id, in: query, required: false, description: 'AdMob: event id (signed).', schema: {type: string}}
        - {name: custom_data, in: query, required: false, description: 'AdMob: intent token (signed).', schema: {type: string}}
        - {name: user_id, in: query, required: false, description: 'AdMob: intent token when custom_data is empty.', schema: {type: string}}
        - {name: key_id, in: query, required: false, description: 'AdMob: verifier key id.', schema: {type: string}}
        - {name: signature, in: query, required: false, description: 'AdMob: web-safe base64 DER ECDSA signature; must be the last parameter.', schema: {type: string}}
        - {name: event_id, in: query, required: false, description: 'HMAC: event id.', schema: {type: string, maxLength: 128}}
        - {name: token, in: query, required: false, description: 'HMAC: intent token.', schema: {type: string, maxLength: 128}}
        - {name: ts, in: query, required: false, description: 'HMAC: unix seconds.', schema: {type: integer, format: int64}}
        - {name: sig, in: query, required: false, description: 'HMAC: hex HMAC-SHA256 (64 hex chars).', schema: {type: string, pattern: '^[0-9a-fA-F]{64}$'}}
      responses:
        '200':
          description: Credited, ignored, or duplicate.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommerceCallbackResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          description: Signature missing, malformed, unknown key or not verifying; timestamp outside the window (`invalid_signature`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '503':
          description: Ad verifier keys unavailable (`key_fetch_failed`) or overloaded (`overloaded`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    post:
      operationId: commerceAdCallbackPost
      tags: [commerce]
      x-gostack-module: commerce
      summary: Rewarded-ad server-side verification callback (form body)
      description: |
        Same as the GET variant. For `hmac`, parameters are read from the query
        string, or from the form-encoded body when the query string is empty.
        Body limit 16 KiB. See GET for trust model, outcomes and errors.
      security: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/CommerceHmacAdCallback'}
      responses:
        '200':
          description: Credited, ignored, or duplicate.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommerceCallbackResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          description: Signature invalid (`invalid_signature`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '503':
          description: Ad verifier keys unavailable (`key_fetch_failed`) or overloaded (`overloaded`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/admin/games/{game}/products:
    parameters:
      - $ref: '#/components/parameters/Game'
    put:
      operationId: commerceAdminPutProducts
      tags: [commerce]
      x-gostack-module: commerce
      summary: Replace the product catalog and store mappings
      description: |
        Replaces all products of the game. Product and asset ids match
        `[a-z0-9][a-z0-9_-]{0,31}`; grants have 1–32 assets with integers
        1..1e12; providers must be configured; a store product id (1–128 chars)
        maps to at most one product; at most 500 products. Delivered orders keep
        their grants snapshot. Body limit 512 KiB. Returns the stored catalog.
      security:
        - adminKey: []
      requestBody:
        required: true
        content:
          application/json:
