        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/games/{game}/friends/requests:
    parameters:
      - $ref: '#/components/parameters/Game'
    get:
      operationId: socialListFriendRequests
      tags: [social]
      x-gostack-module: social
      summary: List pending friend requests (each direction at most 200, oldest first)
      security: [{gameSession: []}]
      responses:
        '200':
          description: Pending requests.
          content:
            application/json:
              schema:
                type: object
                required: [incoming, outgoing]
                properties:
                  incoming:
                    type: array
                    items: {$ref: '#/components/schemas/SocialPerson'}
                  outgoing:
                    type: array
                    items: {$ref: '#/components/schemas/SocialPerson'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: socialSendFriendRequest
      tags: [social]
      x-gostack-module: social
      summary: Send a friend request by player id or friend code
      description: |
        Body limit 1024 bytes; exactly one of `player_id` / `friend_code`
        (else 400). Friend codes are matched case-insensitively. If the target
        already asked the caller, the friendship is created immediately
        (`200 {"status":"accepted"}`); otherwise `201 {"status":"pending"}`.
        Rate limited per player (`RequestsPerMinute`, default 30, shared with
        invites and shares).
        Errors: `400 invalid_request` (self request, both/neither target);
        `404 not_found` (unknown, hidden or blocked player — indistinguishable);
        `403 requests_disabled` (target set `friend_requests: nobody`);
        `409 already_friends`, `already_requested`, `request_limit`
        (outgoing pending ≥ MaxPendingRequests), `friend_limit`;
        `429 rate_limited`.
      security: [{gameSession: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SocialFriendRequestBody'}
      responses:
        '200':
          description: Target had already requested the caller; now friends.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocialRequestStatus'}
        '201':
          description: Request pending.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocialRequestStatus'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/games/{game}/friends/requests/{player_id}:
    parameters:
      - $ref: '#/components/parameters/Game'
      - name: player_id
        in: path
        required: true
        description: Other player's id. Malformed ids get `404 not_found` (`player not found`).
        schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
    delete:
      operationId: socialCancelFriendRequest
      tags: [social]
      x-gostack-module: social
      summary: Cancel an outgoing friend request (sender side)
      description: 404 `not_found` when no such pending request exists.
      security: [{gameSession: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Cancelled.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocialRequestStatus'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/games/{game}/friends/requests/{player_id}/accept:
    parameters:
      - $ref: '#/components/parameters/Game'
      - name: player_id
        in: path
        required: true
        description: Other player's id. Malformed ids get `404 not_found` (`player not found`).
        schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
    post:
