openapi: 3.1.0
info:
  title: GoStack HTTP API
  version: v1
  summary: GameKit, optional game modules, AgentKit, WebKit, web auth, billing and local object storage.
  description: |
    Machine-readable contract for every HTTP route a GoStack application can mount
    on its public listener (`app.Handler`). The Go handlers are the source of
    truth; `app/openapi_test.go` fails when a registered route is missing from
    this document or a documented route does not exist.

    Conventions (all routes):
    - Every response carries `X-Request-ID`. Errors use the envelope
      `{"error":{"code","message","details?"},"request_id"}` (`ErrorEnvelope`).
      Codes are stable; messages are for humans and may change.
    - JSON bodies are decoded strictly: unknown fields and trailing data are
      rejected with `400 invalid_request`.
    - Times are UTC Unix milliseconds (int64). Money and quantities are integers.
    - `game_id` / `player_id` / tenant always come from the session or API key,
      never from request bodies.
    - The global body limit is `http.max_body_bytes` (default 1 MiB); several
      routes have smaller limits (noted per route) and answer `413 payload_too_large`.
    - Requests beyond `http.max_concurrent` or with a saturated write queue get
      `503 overloaded` with `Retry-After`.
    - Unknown paths and unsupported methods get `404 not_found`
      (message `route not found`), not 405.
    - Per-game quotas (`/v1/admin/games/{game}/quotas`, docs/api/quotas.md)
      apply to every `/v1/games/{game}/...` route: `429 rate_limited` with
      `Retry-After` and `details.quota=requests_per_minute`; `503 overloaded`
      with `details.quota=write_concurrency` for mutating methods; `403
      quota_exceeded` on player creation (`max_players`) and save
      put/restore (`save_bytes_total`).

    Module availability is given per operation by `x-gostack-module` and the tag:
    `core` (always mounted with `kits: [game]`), `ops`, `experiments`, `social`,
    `match`, `commerce`, `realtime` (each enabled by listing it in
    `game.modules`), `webauth` (`auth.web.enabled: true`), `billing`
    (`billing.enabled: true`), `storage-local` (`storage.driver: local`; the
    mount path is the path of `storage.local.public_url`, documented here as
    `/v1/files`), `system` (always).

    Not on the public listener: `GET /metrics` and `/debug/pprof/*` are served
    only on `http.internal_listen` when configured.

    WebSocket: `GET /v1/games/{game}/realtime` is an upgrade endpoint. The
    message protocol (auth, welcome, resume, ack, backpressure, close codes) is
    specified in `docs/api/realtime.md`; OpenAPI cannot express it.
  license:
    name: MIT
servers:
  - url: http://127.0.0.1:8080
    description: Local development server (`gostack serve` default listen address may differ; see `http.listen`).
tags:
  - name: system
    description: Health and readiness probes. Always mounted.
  - name: core
    description: "GameKit P0 player API (`kits: [game]`)."
  - name: core-admin
    description: GameKit admin API (API key with `admin` scope; tenant must own the game).
  - name: ops
    description: "Announcements, events, mail, check-in, tasks, redeem codes (`game.modules: [ops]`). See docs/api/ops.md."
  - name: experiments
    description: "A/B experiments (`game.modules: [experiments]`). See docs/api/experiments.md."
  - name: social
    description: "Friends, blocks, invites, shares (`game.modules: [social]`). See docs/api/social.md."
  - name: match
    description: "Matchmaking tickets, queues and battle-server room API (`game.modules: [match]`). See docs/api/match.md."
  - name: commerce
    description: "IAP verification, store callbacks, rewarded ads (`game.modules: [commerce]`). See docs/api/commerce.md."
  - name: realtime
    description: "WebSocket gateway (`game.modules: [realtime]`, profile lite only). See docs/api/realtime.md."
  - name: webauth
    description: "Cookie session + CSRF web authentication (`auth.web.enabled: true`). See docs/api/webauth.md."
  - name: billing
    description: "Tenant billing accounts and reservations (`billing.enabled: true`, API key scope `billing`). See docs/api/billing.md."
  - name: agent
    description: "AgentKit durable runs (`kits: [agent]`, API key scope `agent`). See docs/api/agent.md."
  - name: web
    description: "WebKit content publishing, SEO, order example and webhooks (`kits: [web]`, API key scope `web` or editor web session). See docs/api/web.md."
  - name: storage-local
    description: "Presigned GET/PUT for the local object store (`storage.driver: local`, profile lite only). See docs/api/storage.md."
  - name: assets
    description: "Static asset releases: current manifest, entry redirect, admin list/rollback (`game.modules: [assets]`; publish with `gostack assets publish`). See docs/api/assets.md."
paths:
  /healthz:
    get:
      operationId: systemHealthz
      tags: [system]
      x-gostack-module: system
      summary: Liveness probe
      description: Always `200 {"status":"ok"}` while the process serves HTTP. Does not touch the database.
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
  /readyz:
    get:
      operationId: systemReadyz
      tags: [system]
      x-gostack-module: system
      summary: Readiness probe
      description: |
        `200 {"status":"ready","version":"..."}` when the server has started, the
        write queue is not saturated and `SELECT 1` on the read pool succeeds
        within 1s. Otherwise `503 overloaded` (`not ready`, `write queue saturated`,
        `database unavailable`). Becomes not-ready at the start of shutdown.
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
        '503': {$ref: '#/components/responses/Overloaded'}

  /v1/games/{game}/{rest}:
    options:
      operationId: coreCorsPreflight
      tags: [core]
      x-gostack-module: core
      summary: CORS preflight for every game route
      description: |
        Registered as `OPTIONS /v1/games/{game}/{rest...}`: matches any subpath
        under the game (including module routes). Always `204`. When the request
        `Origin` is in the game's `allowed_origins`, the response carries
        `Access-Control-Allow-Origin: <origin>`,
        `Access-Control-Allow-Methods: GET, POST, PUT, DELETE, OPTIONS`,
        `Access-Control-Allow-Headers: Authorization, Content-Type, Idempotency-Key, If-None-Match`,
        `Access-Control-Expose-Headers: ETag, Retry-After, X-Request-ID, Idempotent-Replayed`,
        `Access-Control-Max-Age: 600` (also added to actual responses). Other
        origins get no CORS headers (and `Vary: Origin`). The game is not
        required to exist or be active for the preflight itself.
      security: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
        - name: rest
          in: path
          required: true
          description: Any remaining path (may contain `/`).
          schema: {type: string}
      responses:
        '204':
          description: Preflight answered.

  /v1/games/{game}/auth/guest:
    post:
      operationId: coreGuestLogin
      tags: [core]
      x-gostack-module: core
      summary: Register a guest or log an existing guest in
      description: |
        Empty body `{}` registers a new guest: `201` with `guest_id` and a
        one-time `guest_secret` the client must persist. With
        `guest_id`+`guest_secret`: `200`, same player, new session;
        `guest_secret` is `null` unless `rotate: true`, in which case a new
        secret is returned and the old one stops working immediately.
        No Idempotency-Key: first registration must not be retried
        automatically (a retry may create a second guest); credentialed logins
        are safe to retry. Rate limited per game and client IP
        (`game.auth_rate_per_minute`, IPv6 per /64).
        Errors: `400 invalid_request` (only one of guest_id/guest_secret, unknown
        fields), `401 unauthorized` (invalid guest credentials, lost rotation race).
      security: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CoreGuestLoginRequest'}
      responses:
        '200':
          description: Existing guest logged in.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoreGuestLoginResponse'}
        '201':
          description: New guest registered.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoreGuestLoginResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/games/{game}/auth/platform:
    post:
      operationId: corePlatformLogin
      tags: [core]
      x-gostack-module: core
      summary: Exchange a platform login code for a session
      description: |
        The server verifies `code` with the platform (WeChat `jscode2session`,
        5s timeout, outside any DB transaction) and finds or creates the player
        for (game, platform, openid). `201` when the player was created, `200`
        otherwise. Rate limited like guest login.
        Errors: `501 not_implemented` (platform not configured, or not
        configured for this game), `400 invalid_request` (missing/oversized
        code), `401 unauthorized` (platform rejected the code), `503 overloaded`
        (platform unreachable or write queue full).
      security: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CorePlatformCode'}
      responses:
        '200':
          description: Existing player logged in.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CorePlatformLoginResponse'}
        '201':
          description: New player created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CorePlatformLoginResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '501': {$ref: '#/components/responses/NotImplemented'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/games/{game}/auth/bind:
    post:
      operationId: coreBindPlatform
      tags: [core]
      x-gostack-module: core
      summary: Bind a verified platform identity to the current player
      description: |
        Verifies `code` like `/auth/platform` and links the identity to the
        session's player. Binding an identity the player already owns is a
        no-op `200`. `409 identity_conflict` when the identity belongs to
        another player, or the player already has a different identity on that
        platform; nothing is merged or overwritten.
      security:
        - gameSession: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CorePlatformCode'}
      responses:
        '200':
          description: Bound.
          content:
            application/json:
              schema:
                type: object
                required: [player_id, platform]
                properties:
                  player_id: {type: string}
                  platform: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '501': {$ref: '#/components/responses/NotImplemented'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/games/{game}/auth/logout:
    post:
      operationId: coreLogout
      tags: [core]
      x-gostack-module: core
      summary: Revoke the current session
      description: Deletes the session; the body is ignored.
      security:
        - gameSession: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/games/{game}/me:
    get:
      operationId: coreMe
      tags: [core]
      x-gostack-module: core
      summary: Current player
      security:
        - gameSession: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
      responses:
        '200':
          description: Player profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoreMe'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/games/{game}/config:
    get:
      operationId: coreGetConfig
      tags: [core]
      x-gostack-module: core
      summary: Client section of the published configuration (with rollouts)
      description: |
        Returns `{"revision","data"}` where `data` is the `client` section of the
        current published document; `{"revision":0,"data":{}}` when nothing is
        published. Matching rollouts (document order) are shallow-merged into
        `data` and listed in `rollouts`.
        Headers: `ETag` is `"<revision>"`, or `"<revision>-<12 hex>"` when
        rollouts match; `Cache-Control: no-cache`; `Vary: Authorization`.
        `If-None-Match` equal to the current ETag → `304` with no body.
        The bearer token is optional: a valid session buckets rollouts by
        `player_id` (ignoring `bucket_key`); an invalid/expired token is ignored
        (never 401). Without a bucketing key only `percent: 100` rollouts match.
      security:
        - {}
        - gameSession: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
        - name: client_version
          in: query
          description: 1–4 dot-separated non-negative integers (each ≤ 9 digits), e.g. `1.2.3`. Invalid → 400.
          schema:
            type: string
            maxLength: 64
            pattern: '^[0-9]{1,9}(\.[0-9]{1,9}){0,3}$'
        - name: platform
          in: query
          schema: {type: string, maxLength: 32}
        - name: bucket_key
          in: query
          description: Stable anonymous bucketing key (e.g. install id); ignored when a valid session is present.
          schema: {type: string, maxLength: 128}
        - name: If-None-Match
          in: header
          schema: {type: string}
      responses:
        '200':
          description: Current client configuration.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoreClientConfig'}
        '304':
          description: Not modified (ETag matched).
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/games/{game}/saves/{slot}:
    parameters:
      - {$ref: '#/components/parameters/Game'}
      - {name: slot, in: path, required: true, description: 'Save slot (invalid → 400).', schema: {type: string, pattern: '^[a-z0-9_-]{1,32}$'}}
    get:
      operationId: coreGetSave
      tags: [core]
      x-gostack-module: core
      summary: Read a save slot
      description: The payload is returned byte-for-byte as stored, so `checksum` = sha256 hex of the `payload` bytes. `404 not_found` when the slot has no save.
      security:
        - gameSession: []
      responses:
        '200':
          description: Save.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoreSave'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: corePutSave
      tags: [core]
      x-gostack-module: core
      summary: Conditionally write a save slot
      description: |
        Writes revision `current+1` when `expected_revision` equals the current
        revision (0 = create). Body limit `game.save_max_bytes` + 4 KiB; the raw
        `payload` value must be ≤ `game.save_max_bytes` (default 64 KiB) → `413`.
        `checksum`, when given, must equal sha256 hex of the raw `payload` bytes
        (`400` on mismatch). Errors (409): `revision_conflict`
        (`details.current_revision`), `schema_outdated`
        (`details.min_schema_version`), `slot_limit` (`game.save_slots_per_user`,
        default 5), `merge_base_unavailable` (`details.expected_revision`),
        `idempotency_key_reused`.
        `merge: true` resolves a conflict through the application's
        `Kit.SaveMerge` (if set, and the slot exists) and returns `merged: true`.
        History of `game.save_history` revisions (default 10) is kept.
      security:
        - gameSession: []
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CorePutSaveRequest'}
      responses:
        '200':
          description: |
            New save revision (replays carry `Idempotent-Replayed`). `payload` is
            returned only when the server merged (`merged: true`); otherwise the
            stored payload is exactly the bytes sent and `checksum` covers them.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CorePutSaveResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '503': {$ref: '#/components/responses/Overloaded'}
    delete:
      operationId: coreDeleteSave
      tags: [core]
      x-gostack-module: core
      summary: Conditionally delete a save slot and its history
      description: |
        Deletes the slot and all retained revisions when the current revision
        equals `expected_revision`. `404` when the slot does not exist,
        `409 revision_conflict` (`details.current_revision`) on mismatch.
        The idempotency digest is the `expected_revision` value.
      security:
        - gameSession: []
      parameters:
        - name: expected_revision
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: Deleted.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema:
                type: object
                required: [slot, deleted, revision]
                properties:
                  slot: {type: string}
                  deleted: {type: boolean, const: true}
                  revision: {type: integer, format: int64, description: Revision that was deleted.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/games/{game}/saves/{slot}/revisions:
    get:
      operationId: coreListSaveRevisions
      tags: [core]
      x-gostack-module: core
      summary: Retained revision metadata, newest first
      description: '`404` when the slot has neither a current save nor retained history.'
      security:
        - gameSession: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
        - {name: slot, in: path, required: true, description: 'Save slot (invalid → 400).', schema: {type: string, pattern: '^[a-z0-9_-]{1,32}$'}}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Revisions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoreSaveRevisions'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/games/{game}/saves/{slot}/restore:
    post:
      operationId: coreRestoreSave
      tags: [core]
      x-gostack-module: core
      summary: Restore a retained revision as the next revision
      description: |
        Body limit 1 KiB. The current revision must equal `expected_revision`
        (`409 revision_conflict`). `404` when `revision` is not retained;
        `409 schema_outdated` when its schema is below `saves.min_schema_version`.
      security:
        - gameSession: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
        - {name: slot, in: path, required: true, description: 'Save slot (invalid → 400).', schema: {type: string, pattern: '^[a-z0-9_-]{1,32}$'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, expected_revision]
              properties:
                revision: {type: integer, format: int64, minimum: 1}
                expected_revision: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: New save revision.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoreSave'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '503': {$ref: '#/components/responses/Overloaded'}

  /v1/games/{game}/boards/{board}:
    get:
      operationId: coreGetBoard
      tags: [core]
      x-gostack-module: core
      summary: Leaderboard page
      description: |
        Order: score (board `order`) → earlier `achieved_at` → `player_id`.
        Only accepted scores. With a valid session the response includes the
        caller's exact `me` rank (omitted when the caller has no score); an
        invalid token is `401`. `404` for unknown boards.
      security:
        - {}
        - gameSession: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
        - {name: board, in: path, required: true, description: 'Board id from the config document (unknown → 404).', schema: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'}}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: cursor
          in: query
          description: Opaque `next_cursor` from the previous page.
          schema: {type: string}
        - name: season
          in: query
          description: Season id (`all`, `2026-11-24`, `2026-W48`); defaults to the current season.
          schema: {type: string, maxLength: 16}
      responses:
        '200':
          description: Board page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoreBoardPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/games/{game}/boards/{board}/scores:
    post:
      operationId: coreSubmitScore
      tags: [core]
      x-gostack-module: core
      summary: Submit a score
      description: |
        Body limit 4 KiB. Rate limited per player (`game.score_rate_per_minute`,
        shared with `/runs`). Score outside `[min_score,max_score]` → `400`.
        `rule_version` must equal the board's when it is > 0
        (`409 rule_version_mismatch`, `details.rule_version`). `run_token` is
        required when the board has `require_run` (`400` if missing) and is
        verified and consumed whenever present (`409 run_token_invalid` /
        `run_token_used` / `run_token_expired`). Scores above
        `quarantine_above`, or runs shorter than `min_run_ms`, are quarantined
        (`status: quarantined`, not ranked). `best` is the player's resulting
        season score (null when quarantined and no accepted score exists).
        Retries with the same Idempotency-Key return the first result.
      security:
        - gameSession: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
        - {name: board, in: path, required: true, description: 'Board id from the config document (unknown → 404).', schema: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [score]
              properties:
                score: {type: integer, format: int64}
                rule_version: {type: integer, format: int64}
                run_token: {type: string, maxLength: 128}
      responses:
        '200':
          description: Submission result.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoreScoreResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/games/{game}/boards/{board}/runs:
    post:
      operationId: coreStartRun
      tags: [core]
      x-gostack-module: core
      summary: Start a run (one-time run token)
      description: |
        Issues a new single-use token valid for the board's `run_ttl_ms`
        (default 1h); only its SHA-256 is stored. Body ignored. No
        Idempotency-Key: every call issues a new token. Shares the score rate
        limit.
      security:
        - gameSession: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
        - {name: board, in: path, required: true, description: 'Board id from the config document (unknown → 404).', schema: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'}}
      responses:
        '201':
          description: Run started.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoreRun'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Overloaded'}

  /v1/games/{game}/wallet:
    get:
      operationId: coreGetWallet
      tags: [core]
      x-gostack-module: core
      summary: Wallet balances (server ledger is the source of truth)
      security:
        - gameSession: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
      responses:
        '200':
          description: Balances.
          content:
            application/json:
              schema:
                type: object
                required: [balances]
                properties:
                  balances: {$ref: '#/components/schemas/Balances'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/games/{game}/inventory:
    get:
      operationId: coreGetInventory
      tags: [core]
      x-gostack-module: core
      summary: Balances split by the items catalog
      description: |
        Every catalog currency is listed (balance may be 0); catalog items only
        with balance > 0; non-zero assets missing from the catalog go to
        `uncataloged`. Lists are sorted by id.
      security:
        - gameSession: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
      responses:
        '200':
          description: Inventory.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoreInventory'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/games/{game}/rewards/{reward}/claim:
    post:
      operationId: coreClaimReward
      tags: [core]
      x-gostack-module: core
      summary: Claim a configured reward
      description: |
        Body `{}` (limit 1 KiB; included in the idempotency digest). Eligibility
        is decided server-side from the current config inside the write
        transaction. Errors: `404` (unknown reward), `403 forbidden` (outside
        `starts_at`/`ends_at`), `409 already_claimed` (`per_period` reached),
        `409 stack_limit` (`details.asset`, `details.max_stack`; whole claim rolled back).
      security:
        - gameSession: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
        - name: reward
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CoreEmptyBody'}
      responses:
        '200':
          description: Claimed.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoreClaimResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/games/{game}/offers/{offer}/purchase:
    post:
      operationId: corePurchaseOffer
      tags: [core]
      x-gostack-module: core
      summary: Buy a fixed-price offer with in-game assets
      description: |
        Body `{}` (limit 1 KiB). Debits `cost` and credits `grants` in one
        ledger posting (kind `purchase`, source `offer:<purchase_id>`).
        Errors: `404` (unknown offer), `409 insufficient_funds`,
        `409 purchase_limit`, `409 stack_limit`. Nothing is charged on failure.
      security:
        - gameSession: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
        - name: offer
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CoreEmptyBody'}
      responses:
        '200':
          description: Purchased.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CorePurchaseResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '503': {$ref: '#/components/responses/Overloaded'}

  /v1/games/{game}/events/batch:
    post:
      operationId: coreEventsBatch
      tags: [core]
      x-gostack-module: core
      summary: Ingest analytics events (lossy)
      description: |
        Anonymous or authenticated (a valid token attaches `player_id`; an
        invalid/expired token is `401` and the client may resend anonymously).
        Body ≤ 64 KiB, 1–100 events, `properties` ≤ 4096 bytes and a JSON
        object. Events are buffered; when the buffer is full they are dropped
        and counted (`dropped`). Deduplicated by `event_id`, so no
        Idempotency-Key. Rate limited per game and IP at 4×
        `game.auth_rate_per_minute`. Analytics are never used for ledger audit.
      security:
        - {}
        - gameSession: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CoreEventsBatch'}
      responses:
        '202':
          description: Accepted (possibly partially dropped).
          content:
            application/json:
              schema:
                type: object
                required: [accepted, dropped]
                properties:
                  accepted: {type: integer, minimum: 0}
                  dropped: {type: integer, minimum: 0}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/admin/games:
    post:
      operationId: coreAdminCreateGame
      tags: [core-admin]
      x-gostack-module: core
      summary: Register a game in the API key's tenant
      description: '`409 conflict` when the game id already exists (in any tenant). Status starts `active`.'
      security:
        - adminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [game_id]
              properties:
                game_id: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'}
                name: {type: string, description: Defaults to game_id.}
                allowed_origins:
                  type: array
                  description: Exact `Origin` values granted CORS for this game.
                  items: {type: string}
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [game_id]
                properties:
                  game_id: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/admin/games/{game}/config:
    put:
      operationId: coreAdminPublishConfig
      tags: [core-admin]
      x-gostack-module: core
      summary: Validate and publish a configuration document as the next revision
      description: |
        Body limit 1 MiB; the document is parsed strictly (unknown keys → 400)
        and validated (see `CoreConfigDocument`). History is append-only.
        The key's tenant must own the game (`404` otherwise).
      security:
        - adminKey: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CoreConfigDocument'}
      responses:
        '200':
          description: Published.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoreRevision'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/admin/games/{game}/config/rollback:
    post:
      operationId: coreAdminRollbackConfig
      tags: [core-admin]
      x-gostack-module: core
      summary: Republish an earlier revision's document as a new revision
      description: '`404` when the revision does not exist (or the game is not in the key''s tenant).'
      security:
        - adminKey: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties:
                revision: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: New revision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoreRevision'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/admin/games/{game}/players/{player}/adjust:
    post:
      operationId: coreAdminAdjustWallet
      tags: [core-admin]
      x-gostack-module: core
      summary: Operator balance adjustment (audited)
      description: |
        Body limit 16 KiB. Ledger kind `adjust`, source `adjust:<source_key>`;
        reason and API key id are recorded in `wallet_adjustments`. Same
        `source_key` + same player + same deltas → `replayed: true` without
        re-posting; different content → `409 source_key_reused`. Other errors:
        `409 insufficient_funds`, `409 stack_limit`, `400` (asset not in the
        catalog when one exists), `404` (player not in this game).
      security:
        - adminKey: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
        - name: player
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [deltas, reason, source_key]
              properties:
                deltas:
                  type: object
                  minProperties: 1
                  maxProperties: 100
                  description: Asset id → non-zero integer within ±1e12.
                  propertyNames: {pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'}
                  additionalProperties:
                    type: integer
                    format: int64
                    minimum: -1000000000000
                    maximum: 1000000000000
                    not: {const: 0}
                reason: {type: string, minLength: 1, maxLength: 500, description: Trimmed; 1–500 characters.}
                source_key: {type: string, minLength: 1, maxLength: 128, pattern: '^[\x21-\x7E]{1,128}$'}
      responses:
        '200':
          description: Adjusted (or replayed).
          content:
            application/json:
              schema:
                type: object
                required: [source_key, replayed, balances]
                properties:
                  source_key: {type: string}
                  replayed: {type: boolean}
                  balances: {$ref: '#/components/schemas/Balances'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/admin/games/{game}/quarantine:
    get:
      operationId: coreAdminListQuarantine
      tags: [core-admin]
      x-gostack-module: core
      summary: List quarantined score submissions (by id ascending)
      security:
        - adminKey: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
        - name: status
          in: query
          schema: {type: string, enum: [pending, approved, rejected], default: pending}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: after
          in: query
          description: '`next_after` of the previous page.'
          schema: {type: integer, format: int64, minimum: 0, default: 0}
      responses:
        '200':
          description: Page.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_after]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/CoreQuarantineItem'}
                  next_after: {type: [integer, 'null'], format: int64}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/admin/games/{game}/quarantine/{id}/approve:
    post:
      operationId: coreAdminApproveQuarantine
      tags: [core-admin]
      x-gostack-module: core
      summary: Approve a quarantined score
      description: |
        Applies the score to its original season with the board's current
        best/sum rule (achieved_at = original submission time). Repeating the
        same decision → `replayed: true`. Errors: `409 already_reviewed`
        (opposite decision exists), `409 season_settled`, `409 board_removed`,
        `404`. Body ignored.
      security:
        - adminKey: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
        - {name: id, in: path, required: true, description: 'Quarantine entry id (non-numeric → 404).', schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: Reviewed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoreQuarantineReview'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/admin/games/{game}/quarantine/{id}/reject:
    post:
      operationId: coreAdminRejectQuarantine
      tags: [core-admin]
      x-gostack-module: core
      summary: Reject a quarantined score
      description: 'Marks the entry rejected (`best` is null). Same-decision repeats → `replayed: true`; opposite decision → `409 already_reviewed`. Body ignored.'
      security:
        - adminKey: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
        - {name: id, in: path, required: true, description: 'Quarantine entry id (non-numeric → 404).', schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: Reviewed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoreQuarantineReview'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/admin/games/{game}/boards/{board}/seasons/{season}/settle:
    post:
      operationId: coreAdminSettleSeason
      tags: [core-admin]
      x-gostack-module: core
      summary: Run (or resume) a season settlement
      description: |
        Pays rank rewards once per (game, board, season); an already completed
        settlement is returned without paying again. Errors: `400` (season id
        not valid for the board period), `404` (board not found),
        `409 settlement_not_configured`, `409 season_not_ended`
        (`details.settle_after`, season end + 1 min grace). Body ignored.
      security:
        - adminKey: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
        - {name: board, in: path, required: true, description: 'Board id from the config document (unknown → 404).', schema: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'}}
        - {name: season, in: path, required: true, description: 'Season id: `all`, `YYYY-MM-DD` (daily) or `YYYY-Www` (weekly).', schema: {type: string, maxLength: 16}}
      responses:
        '200':
          description: Settlement record.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoreSettlement'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/admin/games/{game}/boards/{board}/seasons/{season}/settlement:
    get:
      operationId: coreAdminGetSettlement
      tags: [core-admin]
      x-gostack-module: core
      summary: Settlement record with payouts (by rank)
      description: '`404` when no settlement exists.'
      security:
        - adminKey: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
        - {name: board, in: path, required: true, description: 'Board id from the config document (unknown → 404).', schema: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'}}
        - {name: season, in: path, required: true, description: 'Season id: `all`, `YYYY-MM-DD` (daily) or `YYYY-Www` (weekly).', schema: {type: string, maxLength: 16}}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
      responses:
        '200':
          description: Settlement and payouts.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/CoreSettlement'}
                  - type: object
                    required: [payouts]
                    properties:
                      payouts:
                        type: array
                        items: {$ref: '#/components/schemas/CorePayout'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/admin/games/{game}/quotas:
    get:
      operationId: coreAdminGetQuotas
      tags: [core-admin]
      x-gostack-module: core
      summary: Effective per-game quotas, overrides, defaults and usage
      description: |
        `usage.players` and `usage.save_bytes` are the exact stored counters;
        `analytics_events_today` and `writes_in_flight` are this instance's
        counters. See docs/api/quotas.md.
      security:
        - adminKey: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
      responses:
        '200':
          description: Quota status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoreQuotaStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: coreAdminPutQuotas
      tags: [core-admin]
      x-gostack-module: core
      summary: Replace the game's quota overrides
      description: |
        Replaces all overrides: a field that is omitted or `null` inherits
        `game.quota_defaults`; `0` means unlimited. Values are within
        [0, 2^50]; `requests_per_minute` <= 1e9. Applies on this instance
        immediately and on other instances within 5 s. Body limit 4 KiB.
      security:
        - adminKey: []
      parameters:
        - {$ref: '#/components/parameters/Game'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CoreQuotaOverrides'}
      responses:
        '200':
          description: Updated quota status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoreQuotaStatus'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '503': {$ref: '#/components/responses/Overloaded'}

  /v1/games/{game}/announcements:
    get:
      operationId: opsListAnnouncements
      tags: [ops]
      x-gostack-module: ops
      summary: Active announcements
      description: |
        Announcements with `starts_at <= now < ends_at` (`ends_at` 0 = open), ordered by priority desc,
        starts_at desc (max 200). Announcements that list platforms are returned only when `platform`
        matches; without `platform` only unrestricted ones are returned. A session is optional; an
        invalid token still gets 401.
      security: [{}, {gameSession: []}]
      parameters:
        - $ref: '#/components/parameters/Game'
        - name: platform
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Active announcements.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpsAnnouncementList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/admin/games/{game}/announcements:
    get:
      operationId: opsAdminListAnnouncements
      tags: [ops]
      x-gostack-module: ops
      summary: All announcements (admin)
      security: [{adminKey: []}]
      parameters:
        - $ref: '#/components/parameters/Game'
      responses:
        '200':
          description: All announcements (max 200).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpsAnnouncementList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/admin/games/{game}/announcements/{id}:
    parameters:
      - $ref: '#/components/parameters/Game'
      - name: id
        in: path
        required: true
        description: Ids not matching the pattern get 404.
        schema: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'}
    put:
      operationId: opsAdminPutAnnouncement
      tags: [ops]
      x-gostack-module: ops
      summary: Create or replace an announcement (admin)
      description: Body limit 16 KiB. 400 when `ends_at` is non-zero and `<= starts_at`.
