  /v1/games/{game}/experiments:
    get:
      operationId: expGetAssignments
      tags: [experiments]
      x-gostack-module: experiments
      summary: Player experiment assignments
      description: |
        Stable bucketing (SHA-256 of game, salt, player). Eligibility uses `platform` (experiments with an empty
        platform list match all) and `client_version` (an experiment with `min_client_version` excludes clients
        that omit it).
      security: [{gameSession: []}]
      parameters:
        - $ref: '#/components/parameters/Game'
        - name: platform
          in: query
          schema: {type: string}
        - name: client_version
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Assignments.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExpAssignments'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/games/{game}/experiments/exposures:
    post:
      operationId: expPostExposures
      tags: [experiments]
      x-gostack-module: experiments
      summary: Record exposures
      description: |
        Records the first exposure per (player, experiment) with the variant assigned at that time; repeats
        are ignored, so retries are safe without an Idempotency-Key (none is honoured). Body limit 8 KiB.
        Pass the same `platform` / `client_version` as for the GET so eligibility matches.
      security: [{gameSession: []}]
      parameters:
        - $ref: '#/components/parameters/Game'
        - name: platform
          in: query
          schema: {type: string}
        - name: client_version
          in: query
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExpExposuresInput'}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/admin/games/{game}/experiments:
    get:
      operationId: expAdminList
      tags: [experiments]
      x-gostack-module: experiments
      summary: List experiments (admin)
      security: [{adminKey: []}]
      parameters:
        - $ref: '#/components/parameters/Game'
      responses:
        '200':
          description: Experiments ordered by id (max 500).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExpExperimentList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/admin/games/{game}/experiments/{id}:
    parameters:
      - $ref: '#/components/parameters/Game'
      - name: id
        in: path
        required: true
        schema: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'}
    get:
      operationId: expAdminGet
      tags: [experiments]
      x-gostack-module: experiments
      summary: Get an experiment (admin)
      security: [{adminKey: []}]
      responses:
        '200':
          description: Experiment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExpExperiment'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: expAdminPut
      tags: [experiments]
      x-gostack-module: experiments
      summary: Create or update an experiment (admin)
      description: |
        Body limit 64 KiB; ids not matching the pattern get 404. Transitions: draft is freely editable and may
        start (`running`) or stop. While running, `layer`, `variants` and `control` are frozen (409
        `immutable_while_running`), returning to draft is 409 `invalid_transition`, and
        `traffic_percent`/`platforms`/`min_client_version` may change. Any PUT to a stopped experiment is 409
        `experiment_stopped`. Starting places the slice first-fit in the layer; no room (or no room to grow at
        the current start) is 409 `layer_full`.
      security: [{adminKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExpExperimentInput'}
      responses:
        '200':
          description: Stored experiment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExpExperiment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '503': {$ref: '#/components/responses/Overloaded'}
    delete:
