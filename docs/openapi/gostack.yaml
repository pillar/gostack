      tags: [experiments]
      x-gostack-module: experiments
      summary: Delete a draft or stopped experiment and its exposures (admin)
      description: 409 `experiment_running` for a running experiment.
      security: [{adminKey: []}]
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/admin/games/{game}/experiments/{id}/stop:
    post:
      operationId: expAdminStop
      tags: [experiments]
      x-gostack-module: experiments
      summary: Kill switch (admin)
      description: Sets status `stopped`; everyone gets the control variant from the next request. Repeating returns 200 unchanged.
      security: [{adminKey: []}]
