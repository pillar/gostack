        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: opsAdminPutCheckin
      tags: [ops]
      x-gostack-module: ops
      summary: Set check-in configuration (admin)
      description: Body limit 64 KiB.
      security: [{adminKey: []}]
      parameters:
        - $ref: '#/components/parameters/Game'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OpsCheckinConfig'}
      responses:
        '200':
          description: Stored configuration (timezone defaulted to UTC).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpsCheckinConfig'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/games/{game}/tasks:
    get:
      operationId: opsListTasks
      tags: [ops]
      x-gostack-module: ops
      summary: Player tasks with current-period progress
      description: Tasks gated by an inactive event are omitted. Max 200.
      security: [{gameSession: []}]
      parameters:
