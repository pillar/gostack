      summary: Retry or waive a refund shortfall
      description: |
        Retries recovering `outstanding` from the player's current balances
        (never below zero). `{"waive": true}` also writes off the remainder. The
        order becomes `refund_compensated` when nothing is outstanding or the
        remainder was waived (the remainder stays visible in `outstanding`).
        Empty body is allowed (= `{"waive": false}`). Body limit 1 KiB.

        Errors: `404 not_found` (order), `409 invalid_state` (order is not in
        `refund_shortfall`).
      security:
        - adminKey: []
