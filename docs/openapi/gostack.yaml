        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/games/{game}/mail/{id}:
    delete:
      operationId: opsDeleteMail
      tags: [ops]
      x-gostack-module: ops
      summary: Hide mail for this player
      description: A mail with an unclaimed attachment is refused with 409 `unclaimed_attachments` unless `discard=true`, which forfeits the attachment.
      security: [{gameSession: []}]
      parameters:
        - $ref: '#/components/parameters/Game'
        - name: id
          in: path
