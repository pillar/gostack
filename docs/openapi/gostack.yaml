  /v1/files/{key}:
    description: |
      Served by `storage.Local.Handler()`, mounted at the path of
      `storage.local.public_url` (here `/v1/files`) when `storage.driver: local`
      (profile lite only). URLs are produced server-side by `Storage.Presign`:
      `<public_url>/<key>?X-GS-Expires=<unix>&X-GS-Signature=<hex>`, signature
      `HMAC-SHA256(secret, "GOSTACK-LOCAL-V1\n" + METHOD + "\n" + key + "\n" + expires)`.
      The subtree is registered for every method: methods other than GET/PUT get
      `405 method_not_allowed` (`Allow: GET, PUT`). A malformed key or a path
      outside the prefix gets `404 not_found`. A bad, expired, wrong-method or
      too-far-future (> 7 days) signature gets `403 forbidden`.
    parameters:
      - name: key
        in: path
        required: true
        description: |
          Object key: 1–512 bytes; `/`-separated segments of 1–255 bytes of
          `[A-Za-z0-9._-]`; no empty, `.` or `..` segment; no leading/trailing `/`.
          (The key may contain `/`, which OpenAPI path templating cannot express.)
        schema:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '^[A-Za-z0-9._-]{1,255}(/[A-Za-z0-9._-]{1,255})*$'
      - name: X-GS-Expires
        in: query
        required: true
        description: Expiry, Unix seconds; must be ≥ now and ≤ now + 7 days.
        schema: {type: integer, format: int64}
      - name: X-GS-Signature
        in: query
        required: true
        description: Hex HMAC-SHA256 (see path description).
        schema: {type: string, pattern: '^[0-9a-f]{64}$'}
    get:
      operationId: storageGetObject
      tags: [storage-local]
      x-gostack-module: storage-local
      summary: Download an object with a presigned GET URL
      security: [{presignedUrl: []}]
      responses:
        '200':
          description: |
            Object body with its stored `Content-Type`, `Content-Length`, `ETag`,
            `X-Content-Type-Options: nosniff`, `Content-Security-Policy: sandbox`,
            `Cache-Control: private, no-store`.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/octet-stream:
              schema: {type: string, contentMediaType: application/octet-stream}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: storagePutObject
      tags: [storage-local]
      x-gostack-module: storage-local
      summary: Upload an object with a presigned PUT URL
      description: |
        Stores the body atomically with the request `Content-Type` (printable
        ASCII, ≤ 255 bytes; empty → `application/octet-stream`). The URL does
        not bind content type or size. Size is bounded by
        `storage.max_object_bytes` and, on the main listener, also by the global
        `http.max_body_bytes` (default 1 MiB) — larger uploads get 413 unless
        that limit is raised. A body whose length differs from `Content-Length`
        gets `400 invalid_request`. Replaces an existing object.
      security: [{presignedUrl: []}]
      requestBody:
        required: true
        content:
          '*/*':
            schema: {type: string, contentMediaType: application/octet-stream}
      responses:
        '200':
          description: Stored (empty body).
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}

  /v1/games/{game}/assets/manifest:
    get:
      operationId: assetsGetManifest
      tags: [assets]
      x-gostack-module: assets
      summary: Current asset release manifest
      description: |
        The manifest of the game's current release: entry and every file (by
        path relative to the build directory) with object key, size, sha256 and
        content type; with `game.assets.public_base_url` also `base_url` and an
        absolute `url` per file. `ETag` is the quoted release id; `If-None-Match`
        gives `304`. `Cache-Control: public, max-age=<game.assets.manifest_max_age>`
        (default 60). `404` until a release is published.
      security: []
      parameters:
        - $ref: '#/components/parameters/Game'
        - name: If-None-Match
          in: header
          schema: {type: string}
      responses:
        '200':
          description: Current manifest.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssetsManifest'}
        '304':
          description: Not modified (release unchanged).
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/games/{game}/assets/entry:
    get:
      operationId: assetsGetEntry
      tags: [assets]
      x-gostack-module: assets
      summary: Redirect to the current entry file
      description: |
        `302` to the current release's entry object: `public_base_url + key`
        with `Cache-Control: public, max-age=<manifest_max_age>`, or without a
        public base URL a presigned storage GET URL (`game.assets.entry_url_ttl`,
        default 10m) with `Cache-Control: no-store`. `404` until a release is published.
      security: []
      parameters:
        - $ref: '#/components/parameters/Game'
