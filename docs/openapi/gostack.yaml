      summary: Rank the caller and friends on a board (accepted scores only)
      description: |
        Uses the board definition of the current published config (404 when
        not configured). Friends with `show_on_friend_boards=false` are left
        out; the caller always sees their own entry. Unpaginated.
      security: [{gameSession: []}]
      parameters:
        - name: season
          in: query
          required: false
          description: Season id (default the board's current season).
          schema: {type: string, maxLength: 16}
      responses:
        '200':
          description: Friend board.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocialFriendBoard'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
