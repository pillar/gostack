  /v1/games/{game}/checkin:
    get:
      operationId: opsGetCheckin
      tags: [ops]
      x-gostack-module: ops
      summary: Check-in status
      description: 404 until check-in is configured.
      security: [{gameSession: []}]
      parameters:
        - $ref: '#/components/parameters/Game'
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpsCheckinStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: opsPostCheckin
      tags: [ops]
      x-gostack-module: ops
      summary: Daily check-in
      description: |
        Once per local day of the configured timezone; reward `cycle[(streak-1) mod len]`
        (ledger source key `checkin:<day>:<player>`). Request body ignored.
        The instant of the last claim is stored; "already checked in today" and
        streak continuity compare the local dates of that instant and of now,
        both in the CURRENT timezone, so an admin timezone change cannot open a
        second claim inside the same real day.
        Errors: 404 not configured; 409 `already_checked_in`; 409 `idempotency_key_reused`.
      security: [{gameSession: []}]
      parameters:
        - $ref: '#/components/parameters/Game'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Checked in.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpsCheckinResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/admin/games/{game}/checkin:
    get:
      operationId: opsAdminGetCheckin
      tags: [ops]
      x-gostack-module: ops
      summary: Check-in configuration (admin)
      security: [{adminKey: []}]
      parameters:
        - $ref: '#/components/parameters/Game'
      responses:
        '200':
          description: Configuration.
          content:
            application/json:
