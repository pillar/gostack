        '503': {$ref: '#/components/responses/Overloaded'}

  /v1/agent/runs:
    post:
      operationId: agentCreateRun
      tags: [agent]
      x-gostack-module: agent
      summary: Start a run of a registered workflow
      description: |
        Inserts a queued run and its `agent.run` job in one transaction. Body ≤ 68 KiB; `input` is any JSON value ≤ 64 KiB (default `{}`).
        `max_steps` 0 → `agent.default_max_steps` (≤ `agent.max_steps`); `max_cost_units` 0 = unlimited; `timeout_seconds` 0 → `agent.default_timeout` (≤ `agent.max_timeout`).
        Errors: `400 invalid_request` (unknown workflow, limits), `409 idempotency_key_reused`.
      security: [{agentKey: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentCreateRun'}
      responses:
        '201':
          description: Run created (status `queued`).
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRun'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '503': {$ref: '#/components/responses/Overloaded'}
    get:
      operationId: agentListRuns
      tags: [agent]
      x-gostack-module: agent
      summary: List the tenant's runs, newest first
      security: [{agentKey: []}]
      parameters:
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/AgentRunStatus'}}
        - {name: before, in: query, required: false, description: Run id cursor (exclusive); use `next_before`., schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Runs without steps.
          content:
            application/json:
              schema:
                type: object
                required: [runs, next_before]
                properties:
                  runs:
                    type: array
                    items: {$ref: '#/components/schemas/AgentRun'}
                  next_before: {type: string, description: Cursor for the next page; empty at the end.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/agent/runs/{id}:
    parameters:
      - {name: id, in: path, required: true, description: Run id in the key's tenant (other tenants' runs are 404)., schema: {type: string}}
    get:
      operationId: agentGetRun
      tags: [agent]
      x-gostack-module: agent
      summary: Read a run with its steps
      security: [{agentKey: []}]
      responses:
        '200':
          description: Run with `steps` (step outputs are not returned).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRun'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/agent/runs/{id}/cancel:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      operationId: agentCancelRun
      tags: [agent]
      x-gostack-module: agent
      summary: Cancel a run
      description: |
        Queued/waiting runs become `cancelled` at once. A running run gets `cancel_requested: true`; the worker stops it between steps or cancels the current step's context (polled every `agent.cancel_poll`).
        Cancelling a cancelled run is a no-op. Errors: `409 invalid_state` (run already finished otherwise).
      security: [{agentKey: []}]
      responses:
        '200':
          description: Run after the request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRun'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /v1/agent/runs/{id}/audit:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: agentRunAudit
      tags: [agent]
      x-gostack-module: agent
      summary: Tool-call audit log of a run (append-only)
      security: [{agentKey: []}]
      responses:
        '200':
          description: Audit rows in order.
          content:
            application/json:
              schema:
                type: object
                required: [tool_calls]
                properties:
                  tool_calls:
                    type: array
                    items: {$ref: '#/components/schemas/AgentToolCall'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/agent/runs/{id}/steps/{seq}/resolve:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: seq, in: path, required: true, schema: {type: integer, minimum: 0}}
    post:
      operationId: agentResolveStep
      tags: [agent]
      x-gostack-module: agent
      summary: Operator decision for a step in needs_reconciliation
      description: |
        After verifying the external system, record whether the interrupted tool call took effect. `succeeded` stores `output` (≤ `agent.inline_output_bytes`) as the step's checkpoint; `failed` makes the step return an error on replay. The run is requeued and resumes without calling the tool again.
        Errors: `400 invalid_request` (outcome, missing note), `404 not_found`, `409 invalid_state` (step is not in needs_reconciliation).
      security: [{agentKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, note]
              additionalProperties: false
              properties:
                outcome: {type: string, enum: [succeeded, failed]}
                output: {description: Step output (JSON) used on replay when succeeded.}
                external_ref: {type: string, maxLength: 256}
                note: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '200':
          description: Run after the decision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRun'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Overloaded'}

