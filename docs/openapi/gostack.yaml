          content:
            application/json:
              schema:
                type: object
                required: [friends]
                properties:
                  friends:
                    type: array
                    items: {$ref: '#/components/schemas/SocialPerson'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/games/{game}/friends/{player_id}:
    parameters:
      - $ref: '#/components/parameters/Game'
