    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: webGetOrder
      tags: [web]
      x-gostack-module: web
      summary: Read an order
      security: [{webKey: []}, {webSession: []}]
      responses:
        '200':
          description: Order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebOrder'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/web/orders/{id}/events:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: webOrderEvents
      tags: [web]
      x-gostack-module: web
      summary: Append-only events of an order, in order
      security: [{webKey: []}, {webSession: []}]
      responses:
        '200':
          description: Events.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: {$ref: '#/components/schemas/WebEvent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/web/orders/{id}/pay:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      operationId: webPayOrder
      tags: [web]
      x-gostack-module: web
      summary: created → paid (billing reserve + settle)
      description: |
        Reserve and settle use keys derived from the order id, so retries never charge twice. Paying a paid/fulfilled order is a no-op; if the order was cancelled meanwhile the charge is refunded.
        Errors: `409 insufficient_funds`, `409 invalid_transition`, billing `409` codes.
      security: [{webKey: []}, {webSession: [], csrfToken: []}]
      responses:
        '200': {description: Order., content: {application/json: {schema: {$ref: '#/components/schemas/WebOrder'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/web/orders/{id}/fulfill:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      operationId: webFulfillOrder
      tags: [web]
      x-gostack-module: web
      summary: paid → fulfilled (no-op when fulfilled)
      description: 'Errors: `409 invalid_transition`.'
      security: [{webKey: []}, {webSession: [], csrfToken: []}]
      responses:
        '200': {description: Order., content: {application/json: {schema: {$ref: '#/components/schemas/WebOrder'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/web/orders/{id}/cancel:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      operationId: webCancelOrder
      tags: [web]
      x-gostack-module: web
      summary: created → cancelled (releases or refunds an in-flight payment)
      description: 'Repeating it re-runs the idempotent compensation. Errors: `409 invalid_transition`.'
      security: [{webKey: []}, {webSession: [], csrfToken: []}]
      responses:
        '200': {description: Order., content: {application/json: {schema: {$ref: '#/components/schemas/WebOrder'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/web/orders/{id}/refund:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      operationId: webRefundOrder
      tags: [web]
      x-gostack-module: web
      summary: paid|fulfilled → refunded (billing credit, at most once)
      description: 'Repeating it re-runs the idempotent credit. Errors: `409 invalid_transition`.'
      security: [{webKey: []}, {webSession: [], csrfToken: []}]
      responses:
        '200': {description: Order., content: {application/json: {schema: {$ref: '#/components/schemas/WebOrder'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/web/public/{site}/pages/{slug}:
    parameters:
      - {name: site, in: path, required: true, schema: {type: string}}
      - {name: slug, in: path, required: true, description: 'Page slug; may contain `/` (route `{slug...}`).', schema: {type: string}}
    get:
      operationId: webPublicPage
      tags: [web]
      x-gostack-module: web
      summary: Published page with effective SEO metadata (public, cached)
      description: |
        Only status `published`. `Cache-Control: public, max-age=<web.public_max_age>` and a strong `ETag`; `If-None-Match` gets `304`. `X-Robots-Tag: noindex` when the revision is noindex. Effective SEO: `title`/`og_title` fall back to the page title, `canonical_url` to `<base_url>/<slug>`.
      security: []
      parameters:
        - {name: If-None-Match, in: header, required: false, schema: {type: string}}
      responses:
        '200':
          description: Page.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebPublicPage'}
        '304': {description: Not modified.}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/web/public/{site}/sitemap.xml:
    parameters:
      - {name: site, in: path, required: true, schema: {type: string}}
    get:
      operationId: webSitemap
      tags: [web]
      x-gostack-module: web
      summary: sitemap.xml of published, indexable pages (≤ 50 000)
      security: []
      responses:
        '200':
          description: Sitemap (ETag / Cache-Control as for pages).
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/xml:
              schema: {type: string}
        '304': {description: Not modified.}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/web/public/{site}/robots.txt:
    parameters:
      - {name: site, in: path, required: true, schema: {type: string}}
    get:
      operationId: webRobots
      tags: [web]
      x-gostack-module: web
      summary: "robots.txt (disallow list and `Sitemap: <base_url>/sitemap.xml`)"
      security: []
      responses:
        '200':
          description: robots.txt.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            text/plain:
              schema: {type: string}
        '304': {description: Not modified.}
        '404': {$ref: '#/components/responses/NotFound'}

components:
  securitySchemes:
    gameSession:
      type: http
      scheme: bearer
      description: |
        GameKit player session: opaque `access_token` returned by `/auth/guest`
        or `/auth/platform` (`Authorization: Bearer <token>`; never in the URL).
        Only the SHA-256 digest is stored. A token of another game gets
        `403 forbidden`; missing/expired/revoked gets `401 unauthorized`.
    adminKey:
      type: http
      scheme: bearer
      description: |
        API key (`gsk_...`) with scope `admin`. For `/v1/admin/games/{game}/...`
        the key's tenant must own the game (other tenants' games look missing:
        `404`). A key without the scope gets `403 forbidden`; a player token
        gets `401 unauthorized`.
    battleKey:
      type: http
      scheme: bearer
      description: API key (`gsk_...`) with scope `battle` (match battle servers). Rooms are bounded to the key's tenant.
    billingKey:
      type: http
      scheme: bearer
      description: API key (`gsk_...`) with scope `billing`. The tenant is the key's tenant; a key without a tenant is refused with `403 forbidden` on every billing route.
    webSession:
      type: apiKey
      in: cookie
      name: __Host-gostack_session
      description: |
        Web session cookie (`HttpOnly; SameSite=Lax; Path=/`). Named
        `__Host-gostack_session` (Secure) when `environment: production`,
        `gostack_session` otherwise.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF token returned by signup/login/me/password; required with the session cookie on unsafe methods.
    agentKey:
      type: http
      scheme: bearer
      description: API key (`gsk_...`) with scope `agent`. The tenant is the key's tenant; a key without a tenant gets `403 forbidden`.
    webKey:
      type: http
      scheme: bearer
      description: API key (`gsk_...`) with scope `web`. The tenant is the key's tenant. Alternatively a web session of a user listed with `POST /v1/web/editors` (unsafe methods also need `X-CSRF-Token`).
    presignedUrl:
      type: apiKey
      in: query
      name: X-GS-Signature
      description: HMAC-SHA256 signature over method, key and `X-GS-Expires`, produced by `Storage.Presign` (TTL ≤ 7 days).

  parameters:
    Game:
      name: game
      in: path
      required: true
      description: Public game id. Unknown ids and ids not matching the pattern get `404 not_found` (`game not found`); disabled games get `403 forbidden`.
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        1–128 printable ASCII characters (0x21–0x7E). Scoped to the caller and
        the operation. Same key + same body replays the first successful
        response (header `Idempotent-Replayed: true`); same key + different body
        gets `409 idempotency_key_reused`. Failed requests are not recorded.
        Keys are retained 72h.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x7E]{1,128}$'
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Same semantics as the optional `Idempotency-Key`, but missing keys are rejected with `400 invalid_request`.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x7E]{1,128}$'

  headers:
    XRequestID:
      description: Server-generated request id (`req_...`); client-supplied values are ignored.
      schema:
        type: string
    RetryAfter:
      description: Whole seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
    IdempotentReplayed:
      description: Present (`true`) when the response is a replay of an earlier request with the same Idempotency-Key.
      schema:
        type: string
        enum: ['true']
    ETag:
      description: Strong entity tag (quoted).
      schema:
        type: string

  responses:
    NoContent:
      description: No content.
    BadRequest:
      description: Invalid parameters or body (`invalid_request` unless a more specific code is listed on the route).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Unauthorized:
      description: Missing, invalid, expired or revoked credentials (`unauthorized`).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Forbidden:
      description: Authenticated but not allowed (`forbidden`, e.g. disabled game, token of another game, missing API key scope).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    NotFound:
      description: Resource (or game) not found (`not_found`).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Conflict:
      description: State conflict; the `code` identifies the rule (see route description).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    PayloadTooLarge:
      description: Body larger than the route or global limit (`payload_too_large`).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    RateLimited:
      description: Rate limit exceeded (`rate_limited`).
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    NotImplemented:
      description: Capability not configured (`not_implemented`).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Overloaded:
      description: Write queue full, concurrency limit reached, request deadline exceeded or not ready (`overloaded`).
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  schemas:
    ErrorEnvelope:
      type: object
      required: [error, request_id]
      properties:
        error:
          $ref: '#/components/schemas/Error'
        request_id:
          type: string
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Human-readable; not stable.
        details:
          type: object
          additionalProperties: true
          description: Optional structured data (e.g. `current_revision`, `min_schema_version`, `rule_version`, `settle_after`).
    ErrorCode:
      type: string
      description: |
        Stable machine-readable error code. `app/openapi_test.go` checks that
        every code literal passed to `httpx.NewError`/`httpx.Conflict` in the
        Go source is listed here.
      enum:
        # generic (core/httpx and shared helpers)
        - invalid_request
        - unauthorized
        - forbidden
        - not_found
        - payload_too_large
        - rate_limited
        - not_implemented
        - overloaded
        - internal
        - method_not_allowed
        - unsupported_media_type
        - idempotency_key_reused
        - invalid_state
        # GameKit core
        - revision_conflict
        - already_claimed
        - identity_conflict
        - slot_limit
        - insufficient_funds
        - schema_outdated
        - merge_base_unavailable
        - stack_limit
        - unknown_asset
        - purchase_limit
        - rule_version_mismatch
        - run_token_invalid
        - run_token_used
        - run_token_expired
        - source_key_reused
        - already_reviewed
        - season_settled
        - board_removed
        - settlement_not_configured
        - season_not_ended
        - conflict
        - quota_exceeded
        # ops
        - already_checked_in
        - already_redeemed
        - code_exists
        - invalid_code
        - no_attachment
        - not_completed
        - unclaimed_attachments
        # experiments
        - experiment_running
        - experiment_stopped
        - immutable_while_running
        - invalid_transition
        - layer_full
        # social
        - already_friends
        - already_requested
        - already_attributed
        - block_limit
        - friend_limit
        - invite_full
        - invite_limit
        - request_limit
        - requests_disabled
        - self_invite
        - own_share
        - not_new_player
        - identity_required
        - already_paid
        # match
        - already_matched
        - ticket_active
        - ticket_closed
        - stale_token
        - room_abandoned
        - room_settled
        - not_a_member
        - no_board
        - board_unavailable
        - already_settled
        # commerce
        - product_not_mapped
        - product_mismatch
        - transaction_already_used
        - transaction_owned_by_other_player
        - transaction_refunded
        - unknown_app_account_token
        - bundle_mismatch
        - environment_mismatch
        - invalid_signature
        - provider_not_configured
        - key_fetch_failed
        - too_many_intents
        - ad_cap_reached
        - amount_mismatch
        - store_unavailable
        - purchase_pending
        - test_purchase_rejected
        - invalid_purchase
        - package_mismatch
        - merchant_mismatch
        - app_mismatch
        - prepay_conflict
        - order_expired
        - wechat_identity_required
        # realtime (pre-upgrade HTTP errors)
        - token_in_url
        - origin_not_allowed
        # webauth
        - csrf_failed
        - invalid_credentials
        - invalid_email
        - invalid_password
        - email_taken
        - password_changed
        - signup_disabled
        # billing
        - account_exists
        - balance_limit
        - reservation_expired
        # assets
        - release_pruned
        - release_incomplete
        # web
        - slug_taken
    AssetsFile:
      type: object
      required: [key, size, sha256, content_type]
      properties:
        path: {type: string, description: Entry only (files are keyed by path).}
        key: {type: string, description: 'Object key, e.g. games/<game>/assets/<sha256>/<name>.'}
        size: {type: integer, format: int64}
        sha256: {type: string}
        content_type: {type: string}
        url: {type: string, description: Present only with game.assets.public_base_url.}
    AssetsManifest:
      type: object
      required: [manifest_version, game_id, release_id, label, created_at, entry, files]
      properties:
        manifest_version: {type: integer, enum: [1]}
        game_id: {type: string}
        release_id: {type: string}
        label: {type: string}
        created_at: {type: string, format: date-time}
        base_url: {type: string}
        entry: {$ref: '#/components/schemas/AssetsFile'}
        files:
          type: object
          additionalProperties: {$ref: '#/components/schemas/AssetsFile'}
    AssetsRelease:
      type: object
      properties:
        game_id: {type: string}
        release_id: {type: string}
        label: {type: string}
        manifest_key: {type: string}
        manifest_size: {type: integer, format: int64}
        manifest_sha256: {type: string}
        entry_path: {type: string}
        entry_key: {type: string}
        entry_size: {type: integer, format: int64}
        entry_sha256: {type: string}
        file_count: {type: integer}
        total_bytes: {type: integer, format: int64}
        created_at: {type: integer, format: int64, description: epoch ms}
        created_by: {type: string}
        status: {type: string, enum: [published, pruned]}
        current: {type: boolean}
    Balances:
      type: object
      description: Asset code → integer balance.
      additionalProperties:
        type: integer
        format: int64
    Grants:
      type: object
      description: Asset code → positive integer quantity.
      additionalProperties:
        type: integer
        format: int64
        minimum: 1
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
        version:
          type: string
    CoreEmptyBody:
      type: object
      additionalProperties: true
      description: Send `{}`. The raw body (≤ 1 KiB) is part of the idempotency digest, so retries must send identical bytes; its content is otherwise ignored.
    CoreGuestLoginRequest:
      type: object
      additionalProperties: false
      description: '`{}` registers a new guest; `guest_id` and `guest_secret` must be sent together to log in.'
      properties:
        guest_id: {type: string}
        guest_secret: {type: string}
        rotate:
          type: boolean
          description: Issue a new guest_secret (old one invalidated immediately).
    CoreGuestLoginResponse:
      type: object
      required: [player_id, guest_id, guest_secret, access_token, expires_at, created]
      properties:
        player_id: {type: string, description: '`plr_` + 26 base32 chars.'}
        guest_id: {type: string, description: '`gst_` + 26 base32 chars.'}
        guest_secret:
          type: [string, 'null']
          description: Returned on registration and on `rotate`; otherwise null. Shown once; store it.
        access_token: {type: string, description: 'Opaque session token (default TTL `game.session_ttl`, 24h).'}
        expires_at: {type: integer, format: int64}
        created: {type: boolean}
    CorePlatformCode:
      type: object
      additionalProperties: false
      required: [platform, code]
      properties:
        platform:
          type: string
          description: Configured platform verifier; only `wechat` is implemented.
          examples: [wechat]
        code: {type: string, minLength: 1, maxLength: 256}
    CorePlatformLoginResponse:
      type: object
      required: [player_id, access_token, expires_at, created]
      properties:
        player_id: {type: string}
        access_token: {type: string}
        expires_at: {type: integer, format: int64}
        created: {type: boolean}
    CoreMe:
      type: object
      required: [player_id, game_id, created_at, identities]
      properties:
        player_id: {type: string}
        game_id: {type: string}
        created_at: {type: integer, format: int64}
        identities:
          type: array
          description: Distinct identity providers, sorted (e.g. `guest`, `wechat`).
          items: {type: string}
    CoreClientConfig:
      type: object
      required: [revision, data]
      properties:
        revision: {type: integer, format: int64, minimum: 0}
        data:
          type: object
          additionalProperties: true
          description: The `client` section with matching rollouts merged in.
        rollouts:
          type: array
          description: Ids of applied rollouts (present only when at least one matched).
          items: {type: string}
    CoreSave:
      type: object
      required: [slot, revision, schema_version, checksum, payload, updated_at]
      properties:
        slot: {type: string}
        revision: {type: integer, format: int64, minimum: 1}
        schema_version: {type: integer, format: int64, minimum: 0}
        checksum: {type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 hex of the payload bytes.}
        payload: {description: Any JSON value except null.}
        updated_at: {type: integer, format: int64}
        merged:
          type: boolean
          description: Present (true) only on PUT when the server merged a conflict via SaveMerge.
    CorePutSaveResponse:
      type: object
      required: [slot, revision, schema_version, checksum, updated_at]
      properties:
        slot: {type: string}
        revision: {type: integer, format: int64, minimum: 1}
        schema_version: {type: integer, format: int64, minimum: 0}
        checksum: {type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 hex of the stored payload bytes.}
        updated_at: {type: integer, format: int64}
        merged: {type: boolean, description: Present (true) only when the server merged a conflict via SaveMerge.}
        payload: {description: The merged payload; present only when merged is true.}
    CorePutSaveRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, payload]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 0, description: 0 = create.}
        schema_version: {type: integer, format: int64, minimum: 0, default: 0}
        payload: {description: Any JSON value except null; raw size ≤ game.save_max_bytes.}
        checksum: {type: string, description: 'Optional sha256 hex of the raw `payload` bytes.'}
        merge: {type: boolean, default: false}
    CoreSaveRevisions:
      type: object
      required: [slot, current_revision, revisions]
      properties:
        slot: {type: string}
        current_revision: {type: integer, format: int64, description: 0 when the slot was deleted but history remains.}
        revisions:
          type: array
          items:
            type: object
            required: [revision, schema_version, checksum, size, created_at]
            properties:
              revision: {type: integer, format: int64}
              schema_version: {type: integer, format: int64}
              checksum: {type: string}
              size: {type: integer, format: int64, description: Payload bytes.}
              created_at: {type: integer, format: int64}
    CoreBoardEntry:
      type: object
      required: [rank, player_id, score, achieved_at]
      properties:
        rank: {type: integer, format: int64, minimum: 1}
        player_id: {type: string}
        score: {type: integer, format: int64}
        achieved_at: {type: integer, format: int64}
    CoreBoardPage:
      type: object
      required: [board, season, entries, next_cursor]
      properties:
        board: {type: string}
        season: {type: string}
        entries:
          type: array
          items: {$ref: '#/components/schemas/CoreBoardEntry'}
        next_cursor: {type: [string, 'null']}
        me:
          type: object
          description: Present only with a valid session and an accepted score in this season.
          required: [rank, score]
          properties:
            rank: {type: integer, format: int64}
            score: {type: integer, format: int64}
    CoreScoreResult:
      type: object
      required: [status, best, season]
      properties:
        status: {type: string, enum: [accepted, quarantined]}
        best: {type: [integer, 'null'], format: int64}
        season: {type: string}
    CoreRun:
      type: object
      required: [run_token, board, started_at, expires_at]
      properties:
        run_token: {type: string, description: '`run_` + 26 base32 chars; single use.'}
        board: {type: string}
        started_at: {type: integer, format: int64}
        expires_at: {type: integer, format: int64}
    CoreInventoryEntry:
      type: object
      required: [id, balance]
      properties:
        id: {type: string}
        name: {type: string, description: Omitted when the catalog has no name.}
        balance: {type: integer, format: int64}
        max_stack: {type: integer, format: int64, description: Omitted when 0 (unlimited).}
    CoreInventory:
      type: object
      required: [currencies, items, uncataloged]
      properties:
        currencies:
          type: array
          items: {$ref: '#/components/schemas/CoreInventoryEntry'}
        items:
          type: array
          items: {$ref: '#/components/schemas/CoreInventoryEntry'}
        uncataloged: {$ref: '#/components/schemas/Balances'}
    CoreClaimResult:
      type: object
      required: [claim_id, grants, balances, config_revision]
      properties:
        claim_id: {type: string}
        grants: {$ref: '#/components/schemas/Grants'}
        balances: {$ref: '#/components/schemas/Balances'}
        config_revision: {type: integer, format: int64}
    CorePurchaseResult:
      type: object
      required: [purchase_id, cost, grants, balances, config_revision]
      properties:
        purchase_id: {type: string}
        cost: {$ref: '#/components/schemas/Grants'}
        grants: {$ref: '#/components/schemas/Grants'}
        balances: {$ref: '#/components/schemas/Balances'}
        config_revision: {type: integer, format: int64}
    CoreEvent:
      type: object
      additionalProperties: false
      required: [event_id, event_name, session_id]
      properties:
        event_id: {type: string, minLength: 1, maxLength: 64, pattern: '^[\x21-\x7E]+$', description: Deduplication key.}
        event_name: {type: string, minLength: 1, maxLength: 64, pattern: '^[\x21-\x7E]+$'}
        session_id: {type: string, minLength: 1, maxLength: 64, pattern: '^[\x21-\x7E]+$'}
        client_time: {type: integer, format: int64}
        client_version: {type: string, maxLength: 32}
        platform: {type: string, maxLength: 16}
        schema_version: {type: integer, format: int64}
        properties:
          type: [object, 'null']
          additionalProperties: true
          description: JSON object ≤ 4096 bytes (null/absent → {}).
    CoreEventsBatch:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/CoreEvent'}
    CoreRevision:
      type: object
      required: [revision]
      properties:
        revision: {type: integer, format: int64}
    CoreQuarantineItem:
      type: object
      required: [id, board, season, player_id, score, reason, created_at, review, reviewed_by, reviewed_at]
      properties:
        id: {type: integer, format: int64}
        board: {type: string}
        season: {type: string}
        player_id: {type: string}
        score: {type: integer, format: int64}
        reason: {type: string, examples: [above quarantine threshold, run shorter than min_run_ms]}
        created_at: {type: integer, format: int64}
        review: {type: string, enum: [pending, approved, rejected]}
        reviewed_by: {type: [string, 'null'], description: API key id of the reviewer.}
        reviewed_at: {type: [integer, 'null'], format: int64}
    CoreQuarantineReview:
      type: object
      required: [entry, best, replayed]
      properties:
        entry: {$ref: '#/components/schemas/CoreQuarantineItem'}
        best: {type: [integer, 'null'], format: int64, description: Resulting score on approve; null on reject or replay.}
        replayed: {type: boolean}
    CoreSettlement:
      type: object
      required: [game_id, board, season, status, config_revision, paid_players, created_at, completed_at]
      properties:
        game_id: {type: string}
        board: {type: string}
        season: {type: string}
        status: {type: string, enum: [running, completed]}
        config_revision: {type: integer, format: int64}
        paid_players: {type: integer, format: int64}
        created_at: {type: integer, format: int64}
        completed_at: {type: [integer, 'null'], format: int64}
    CorePayout:
      type: object
      required: [rank, player_id, score, grants]
      properties:
        rank: {type: integer, format: int64}
        player_id: {type: string}
        score: {type: integer, format: int64}
        grants: {$ref: '#/components/schemas/Grants'}
    CoreQuotas:
      type: object
      description: Effective limits; 0 = unlimited.
      required: [max_players, requests_per_minute, save_bytes_total, analytics_events_per_day, write_concurrency]
      properties:
        max_players: {type: integer, format: int64}
        requests_per_minute: {type: integer, format: int64}
        save_bytes_total: {type: integer, format: int64}
        analytics_events_per_day: {type: integer, format: int64}
        write_concurrency: {type: integer, format: int64}
    CoreQuotaOverrides:
      type: object
      description: Per-game overrides; omitted or null inherits the configured default.
      additionalProperties: false
      properties:
        max_players: {type: [integer, 'null'], format: int64, minimum: 0}
        requests_per_minute: {type: [integer, 'null'], format: int64, minimum: 0, maximum: 1000000000}
        save_bytes_total: {type: [integer, 'null'], format: int64, minimum: 0}
        analytics_events_per_day: {type: [integer, 'null'], format: int64, minimum: 0}
        write_concurrency: {type: [integer, 'null'], format: int64, minimum: 0}
    CoreQuotaStatus:
      type: object
      required: [game_id, limits, overrides, defaults, usage]
      properties:
        game_id: {type: string}
        limits: {$ref: '#/components/schemas/CoreQuotas'}
        overrides: {$ref: '#/components/schemas/CoreQuotaOverrides'}
        defaults: {$ref: '#/components/schemas/CoreQuotas'}
        usage:
          type: object
          required: [players, save_bytes]
          properties:
            players: {type: integer, format: int64}
            save_bytes: {type: integer, format: int64, description: Sum of current save payload bytes (retained revisions excluded).}
            analytics_events_today: {type: integer, format: int64, description: This instance's admitted events for the current UTC day.}
            writes_in_flight: {type: integer, format: int64, description: This instance's mutating requests in flight.}
    CoreConfigDocument:
      type: object
      additionalProperties: false
      description: |
        Published configuration. All sections are optional (a missing `client`
        is treated as `{}`). Ids match `^[a-z0-9][a-z0-9_-]{0,31}$`. When an
        `items` catalog exists, every asset referenced by rewards, offers and
        settlement grants must be in it. Asset amounts are integers in
        [1, 1e12]. Violations → `400 invalid_request`.
      properties:
        client:
          type: object
          additionalProperties: true
          description: Client-visible keys returned by GET /config.
        boards:
          type: object
          propertyNames: {pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'}
          additionalProperties: {$ref: '#/components/schemas/CoreBoardDef'}
        rewards:
          type: object
          propertyNames: {pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'}
          additionalProperties:
            type: object
            additionalProperties: false
            required: [grants, period, per_period]
            properties:
              grants: {$ref: '#/components/schemas/Grants'}
              period: {type: string, enum: [once, daily]}
              per_period: {type: integer, minimum: 1, maximum: 1000}
              starts_at: {type: integer, format: int64, description: 0 = unbounded.}
              ends_at: {type: integer, format: int64, description: 0 = unbounded (exclusive).}
        saves:
          type: object
          additionalProperties: false
          properties:
            min_schema_version: {type: integer, format: int64, minimum: 0}
        items:
          type: object
          propertyNames: {pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'}
          additionalProperties:
            type: object
            additionalProperties: false
            required: [kind]
            properties:
              kind: {type: string, enum: [currency, item]}
              name: {type: string, maxLength: 64}
              max_stack: {type: integer, format: int64, minimum: 0, description: Items only; 0 = unlimited.}
        offers:
          type: object
          propertyNames: {pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'}
          additionalProperties:
            type: object
            additionalProperties: false
            required: [cost, grants, period]
            description: cost and grants must not share assets; per_period 1–1000 for once/daily, absent for unlimited.
            properties:
              cost: {$ref: '#/components/schemas/Grants'}
              grants: {$ref: '#/components/schemas/Grants'}
              period: {type: string, enum: [once, daily, unlimited]}
              per_period: {type: integer, minimum: 1, maximum: 1000}
        rollouts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, client]
            properties:
              id: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,31}$', description: Unique within the document.}
              enabled: {type: boolean, default: false}
              percent: {type: integer, minimum: 0, maximum: 100, description: 0 never matches; < 100 needs a bucketing key.}
              platforms:
                type: array
                items: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'}
              min_client_version: {type: string, description: Dotted version; inclusive.}
              max_client_version: {type: string, description: Dotted version; inclusive; ≥ min.}
              client:
                type: object
                minProperties: 1
                additionalProperties: true
    CoreBoardDef:
      type: object
      additionalProperties: false
      required: [order, mode, period, min_score, max_score]
      description: sum boards must be desc with min_score ≥ 0; min_score ≤ max_score.
      properties:
        order: {type: string, enum: [desc, asc]}
        mode: {type: string, enum: [best, sum]}
        period: {type: string, enum: [none, daily, weekly]}
        min_score: {type: integer, format: int64}
        max_score: {type: integer, format: int64}
        quarantine_above: {type: integer, format: int64, description: Per-submission threshold; above it scores are quarantined.}
        rule_version: {type: integer, format: int64, minimum: 0, description: '> 0 requires submissions to echo it.'}
        require_run: {type: boolean}
        min_run_ms: {type: integer, format: int64, minimum: 0, description: Requires require_run; must be < run TTL.}
        run_ttl_ms: {type: integer, format: int64, minimum: 0, maximum: 604800000, description: 'Requires require_run; 0 = 1h default.'}
        settlement:
          type: object
          additionalProperties: false
          required: [rewards]
          description: daily/weekly boards only.
          properties:
            rewards:
              type: array
              minItems: 1
              description: Ascending, non-overlapping rank ranges within [1, 10000].
              items:
                type: object
                additionalProperties: false
                required: [from_rank, to_rank, grants]
                properties:
                  from_rank: {type: integer, minimum: 1, maximum: 10000}
                  to_rank: {type: integer, minimum: 1, maximum: 10000}
                  grants: {$ref: '#/components/schemas/Grants'}

    OpsInstant:
      description: Epoch milliseconds (non-negative integer) or an RFC3339 string (the offset carries the zone). 0 means unset where allowed.
      oneOf:
        - type: integer
          format: int64
          minimum: 0
        - type: string
          format: date-time
    OpsGrantsInput:
      type: object
      description: Asset id → positive integer amount (≤ 20 assets, each 1..1e12). Paid through the append-only ledger (kind `reward`). Not checked against the `items` catalog or `max_stack`.
      maxProperties: 20
      propertyNames:
        pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
      additionalProperties:
        type: integer
        format: int64
        minimum: 1
        maximum: 1000000000000
    OpsTimezone:
      type: string
      description: IANA time zone name (e.g. `Asia/Shanghai`); empty or omitted means `UTC`. `Local` and unknown names are rejected (400).
    OpsAnnouncementInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Required, ≤ 200 bytes.
        body:
          type: string
          maxLength: 8000
          description: ≤ 8000 bytes.
        priority:
          type: integer
          description: Higher first.
        starts_at:
          $ref: '#/components/schemas/OpsInstant'
        ends_at:
          $ref: '#/components/schemas/OpsInstant'
          description: 0 = open-ended; otherwise must be after `starts_at`.
        platforms:
          type: array
          maxItems: 8
          items:
            type: string
          description: Empty = all platforms.
    OpsAnnouncement:
      type: object
      required: [id, title, body, priority, starts_at, ends_at, platforms]
      properties:
        id: {type: string}
        title: {type: string}
        body: {type: string}
        priority: {type: integer}
        starts_at: {type: integer, format: int64}
        ends_at: {type: integer, format: int64, description: 0 = open-ended}
        platforms:
          type: array
          items: {type: string}
    OpsAnnouncementList:
      type: object
      required: [announcements]
      properties:
        announcements:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/OpsAnnouncement'}
    OpsEventInput:
      type: object
      additionalProperties: false
      required: [title, starts_at, ends_at]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        starts_at:
          $ref: '#/components/schemas/OpsInstant'
          description: Required (non-zero).
        ends_at:
          $ref: '#/components/schemas/OpsInstant'
          description: Required; must be after `starts_at`.
        timezone:
          $ref: '#/components/schemas/OpsTimezone'
        metadata:
          type: object
          additionalProperties: true
          description: JSON object ≤ 8 KiB; defaults to `{}`.
    OpsEvent:
      type: object
      required: [id, title, starts_at, ends_at, timezone, metadata]
      properties:
        id: {type: string}
        title: {type: string}
        starts_at: {type: integer, format: int64}
        ends_at: {type: integer, format: int64}
        timezone: {type: string, description: Descriptive for clients; the window is absolute.}
        metadata:
          type: object
          additionalProperties: true
    OpsEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/OpsEvent'}
    OpsMailSendInput:
      type: object
      additionalProperties: false
      required: [title]
      description: "Exactly one of `player_id` or `broadcast: true`."
      properties:
        player_id:
          type: string
          maxLength: 64
          description: Target player (must exist in the game, else 404).
        broadcast:
          type: boolean
          description: Stored once; visible to players registered at or before the send time.
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          maxLength: 8000
        grants:
          $ref: '#/components/schemas/OpsGrantsInput'
        expires_at:
          $ref: '#/components/schemas/OpsInstant'
          description: 0/omitted = never; otherwise must be in the future.
    OpsMailSent:
      type: object
      required: [mail_id, broadcast]
      properties:
        mail_id: {type: string, description: '`mail_...`'}
        broadcast: {type: boolean}
    OpsAdminMail:
      type: object
      required: [mail_id, player_id, broadcast, title, grants, created_at, expires_at, claimed_count]
      properties:
        mail_id: {type: string}
        player_id: {type: string, description: Empty for broadcasts.}
        broadcast: {type: boolean}
        title: {type: string}
        grants: {$ref: '#/components/schemas/Grants'}
        created_at: {type: integer, format: int64}
        expires_at: {type: integer, format: int64, description: 0 = never}
        claimed_count: {type: integer, format: int64}
    OpsAdminMailList:
      type: object
      required: [mail]
      properties:
        mail:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/OpsAdminMail'}
    OpsMail:
      type: object
      required: [id, title, body, grants, created_at, expires_at, read, claimed, claimable]
      properties:
        id: {type: string}
        title: {type: string}
        body: {type: string}
        grants: {$ref: '#/components/schemas/Grants'}
        created_at: {type: integer, format: int64}
        expires_at: {type: integer, format: int64, description: 0 = never}
        read: {type: boolean}
        claimed: {type: boolean}
        claimable: {type: boolean, description: Has grants and not yet claimed.}
    OpsMailList:
      type: object
      required: [mail]
      properties:
        mail:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/OpsMail'}
    OpsMailClaimResult:
      type: object
      required: [mail_id, grants]
      properties:
        mail_id: {type: string}
        grants: {$ref: '#/components/schemas/Grants'}
    OpsCheckinConfig:
      type: object
      additionalProperties: false
      required: [cycle]
      properties:
        cycle:
          type: array
          minItems: 1
          maxItems: 366
          description: Reward per streak day; each entry is a non-empty grants object.
          items: {$ref: '#/components/schemas/OpsGrantsInput'}
        timezone:
          $ref: '#/components/schemas/OpsTimezone'
        streak_reset:
          type: boolean
          description: When true, missing a local day restarts the streak at 1.
    OpsCheckinStatus:
      type: object
      required: [timezone, today, checked_in_today, streak, total, cycle_length, next_index, next_grants, next_available_at]
      properties:
        timezone: {type: string}
        today: {type: string, format: date, description: Local date in the configured timezone.}
        checked_in_today: {type: boolean}
        streak: {type: integer, format: int64}
        total: {type: integer, format: int64}
        cycle_length: {type: integer}
        next_index: {type: integer}
        next_grants: {$ref: '#/components/schemas/Grants'}
        next_available_at: {type: integer, format: int64, description: Next local midnight (epoch ms).}
    OpsCheckinResult:
      type: object
      required: [day, streak, index, grants]
      properties:
        day: {type: string, format: date}
        streak: {type: integer, format: int64}
        index: {type: integer}
        grants: {$ref: '#/components/schemas/Grants'}
    OpsTaskInput:
      type: object
      additionalProperties: false
      required: [metric, target, period, grants]
      properties:
        title:
          type: string
          maxLength: 200
        metric:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
        target:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
        period:
          type: string
          enum: [once, daily, weekly]
        grants:
          $ref: '#/components/schemas/OpsGrantsInput'
        timezone:
          $ref: '#/components/schemas/OpsTimezone'
        event_id:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
          description: When set, the task is visible, counted and claimable only while that event is active.
    OpsTask:
      type: object
      required: [id, title, metric, target, period, grants, timezone, event_id]
      properties:
        id: {type: string}
        title: {type: string}
        metric: {type: string}
        target: {type: integer, format: int64}
        period: {type: string, enum: [once, daily, weekly]}
        grants: {$ref: '#/components/schemas/Grants'}
        timezone: {type: string}
        event_id: {type: string}
    OpsTaskList:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/OpsTask'}
    OpsPlayerTask:
      type: object
      required: [id, title, metric, target, period, grants, period_key, progress, completed, claimed, claimable]
      properties:
        id: {type: string}
        title: {type: string}
        metric: {type: string}
        target: {type: integer, format: int64}
        period: {type: string, enum: [once, daily, weekly]}
        grants: {$ref: '#/components/schemas/Grants'}
        period_key: {type: string, description: '`once`, local date `YYYY-MM-DD` or ISO week `YYYY-Www`.'}
        progress: {type: integer, format: int64, description: Capped at target.}
        completed: {type: boolean}
        claimed: {type: boolean}
        claimable: {type: boolean}
    OpsPlayerTaskList:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/OpsPlayerTask'}
    OpsTaskClaimResult:
      type: object
      required: [task_id, period_key, grants]
      properties:
        task_id: {type: string}
        period_key: {type: string}
        grants: {$ref: '#/components/schemas/Grants'}
    OpsProgressInput:
      type: object
      additionalProperties: false
      required: [player_id, metric, delta]
      properties:
        player_id: {type: string, minLength: 1}
        metric: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'}
        delta: {type: integer, format: int64, minimum: 1, maximum: 1000000000}
    OpsProgressResult:
      type: object
      required: [tasks_updated]
      properties:
        tasks_updated: {type: integer}
    OpsRedeemBatchInput:
      type: object
      additionalProperties: false
      required: [grants]
      description: |
        Single-use batch: `count` 1..10000, no `code`/`max_redemptions`.
        Shared code: `shared: true`, `max_redemptions` 1..1e8, no `count`, optional custom `code`.
      properties:
        label: {type: string, maxLength: 100}
        grants: {$ref: '#/components/schemas/OpsGrantsInput'}
        expires_at:
          $ref: '#/components/schemas/OpsInstant'
          description: 0/omitted = never; otherwise must be in the future.
        count: {type: integer, minimum: 1, maximum: 10000}
        shared: {type: boolean}
        code:
          type: string
          description: Shared only; 4–32 letters/digits after removing dashes/spaces (case-insensitive). Generated (`XXXX-XXXX-XXXX`) when absent.
        max_redemptions: {type: integer, minimum: 1, maximum: 100000000}
    OpsRedeemBatchCreated:
      type: object
      required: [batch_id, shared, max_redemptions, codes]
      properties:
        batch_id: {type: string, description: '`rb_...`'}
        shared: {type: boolean}
        max_redemptions: {type: integer, description: Per code (1 for single-use).}
        codes:
          type: array
          items: {type: string}
          description: Plaintext codes; returned only in this response (only hashes are stored).
    OpsRedeemBatch:
      type: object
      required: [batch_id, label, shared, max_redemptions, grants, expires_at, disabled, created_at, codes, redeemed]
      properties:
        batch_id: {type: string}
        label: {type: string}
        shared: {type: boolean}
        max_redemptions: {type: integer, format: int64}
        grants: {$ref: '#/components/schemas/Grants'}
        expires_at: {type: integer, format: int64}
        disabled: {type: boolean}
        created_at: {type: integer, format: int64}
        codes: {type: integer, format: int64, description: Number of codes in the batch.}
        redeemed: {type: integer, format: int64, description: Total redemptions.}
    OpsRedeemBatchList:
      type: object
      required: [batches]
      properties:
        batches:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/OpsRedeemBatch'}
    OpsRedeemInput:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: {type: string, description: 'Case, dashes and spaces are ignored.'}
    OpsRedeemResult:
      type: object
      required: [batch_id, grants]
      properties:
        batch_id: {type: string}
        grants: {$ref: '#/components/schemas/Grants'}

    ExpAssignment:
      type: object
      required: [layer, variant, params]
      properties:
        layer: {type: string}
        variant: {type: string}
        params:
          type: object
          additionalProperties: true
        stopped:
          type: boolean
          description: Present (true) for stopped experiments; everyone gets the control variant (kill switch).
    ExpAssignments:
      type: object
      required: [assignments]
      properties:
        assignments:
          type: object
          description: Experiment id → assignment. Running experiments the player falls into, plus stopped experiments (control). Drafts never appear.
          additionalProperties: {$ref: '#/components/schemas/ExpAssignment'}
    ExpExposuresInput:
      type: object
      additionalProperties: false
      required: [experiment_ids]
      properties:
        experiment_ids:
          type: array
          minItems: 1
          maxItems: 50
          items: {type: string}
          description: Invalid, unknown, draft, stopped or not-assigned ids are ignored silently.
    ExpVariant:
      type: object
      additionalProperties: false
      required: [id, weight]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
          description: Unique within the experiment.
        weight:
          type: integer
          minimum: 1
          maximum: 10000
        params:
          type: object
          additionalProperties: true
          description: JSON object ≤ 4 KiB; defaults to `{}`.
    ExpExperimentInput:
      type: object
      additionalProperties: false
      required: [layer, status, variants, control, traffic_percent]
      properties:
        layer:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
        status:
          type: string
          enum: [draft, running, stopped]
        variants:
          type: array
          minItems: 1
          maxItems: 10
          items: {$ref: '#/components/schemas/ExpVariant'}
        control:
          type: string
          description: Must be one of the variant ids.
        traffic_percent:
          type: integer
          minimum: 0
          maximum: 100
        platforms:
          type: array
          maxItems: 8
          items: {type: string}
          description: Empty = all platforms.
        min_client_version:
          type: string
          pattern: '^\d+(\.\d+){0,3}$'
    ExpExperiment:
      type: object
      required: [id, layer, status, variants, control, traffic_percent, platforms, min_client_version]
      properties:
        id: {type: string}
        layer: {type: string}
        status: {type: string, enum: [draft, running, stopped]}
        variants:
          type: array
          items: {$ref: '#/components/schemas/ExpVariant'}
        control: {type: string}
        traffic_percent: {type: integer}
        platforms:
          type: array
          items: {type: string}
        min_client_version: {type: string}
        slice_start:
          type: integer
          description: Running only. First layer slot (0..9999) owned by the experiment.
        slice_end:
          type: integer
          description: Running only. Exclusive end slot (`slice_start + traffic_percent*100`).
    ExpExperimentList:
      type: object
      required: [experiments]
      properties:
        experiments:
          type: array
          maxItems: 500
          items: {$ref: '#/components/schemas/ExpExperiment'}
    ExpResults:
      type: object
      required: [experiment, status, variants, total_exposures]
      properties:
        experiment: {type: string}
        status: {type: string, enum: [draft, running, stopped]}
        variants:
          type: array
          items:
            type: object
            required: [variant, control, exposures]
            properties:
              variant: {type: string}
              control: {type: boolean}
              exposures: {type: integer, format: int64}
        total_exposures: {type: integer, format: int64}

    CommerceGrants:
      type: object
      description: Asset id → positive integer (1..1e12); 1–32 assets.
      minProperties: 1
      maxProperties: 32
      propertyNames:
        pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
      additionalProperties:
        type: integer
        format: int64
        minimum: 1
        maximum: 1000000000000
    CommerceCreateOrderRequest:
      type: object
      additionalProperties: false
      required: [product_id]
      properties:
        product_id:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
    CommerceCreatedOrder:
      type: object
      required: [order_id, product_id, app_account_token, provider_product_ids, state]
      properties:
        order_id:
          type: string
          description: '`ord_` + 26 base32 characters.'
        product_id:
          type: string
        app_account_token:
          type: string
          format: uuid
          description: Pass to StoreKit as `appAccountToken`.
        provider_product_ids:
          type: object
          description: Provider → store product id mapped to this product.
          additionalProperties:
            type: string
        state:
          type: string
          enum: [created]
    CommerceVerifyRequest:
      type: object
      additionalProperties: false
      description: '`apple`: `signed_transaction`. `google`: `product_id` and `purchase_token`.'
      properties:
        signed_transaction:
          type: string
          minLength: 1
          maxLength: 65536
          description: StoreKit 2 / App Store Server API `signedTransactionInfo` (ES256 compact JWS, ≤ 64 KiB).
        product_id:
          type: string
          maxLength: 128
          description: Google Play product id (the store's id, not the catalog id).
        purchase_token:
          type: string
          maxLength: 4096
          description: Google Play purchase token from the client purchase.
    CommerceOrderState:
      type: string
      enum: [created, paid, delivered, refunded, refund_shortfall, refund_compensated]
      description: |
        `created` (token issued) → `delivered` → `refunded` | `refund_shortfall`
        → `refund_compensated`. `paid`: the store reported the payment but no
        player is bound yet.
    CommerceOrder:
      type: object
      required: [order_id, provider, product_id, provider_product_id, provider_txn_id, state, quantity, grants, outstanding, player_id, created_at, updated_at]
      properties:
        order_id: {type: string}
        provider:
          type: string
          description: Empty for an order still in `created`.
        product_id: {type: string}
        provider_product_id: {type: string}
        provider_txn_id: {type: string}
        state: {$ref: '#/components/schemas/CommerceOrderState'}
        quantity:
          type: integer
          description: Transaction quantity (1–1000); 0 before a transaction is attached.
        grants:
          $ref: '#/components/schemas/Balances'
          description: Grants delivered (product grants × quantity); empty before delivery.
        outstanding:
          $ref: '#/components/schemas/Balances'
          description: Refunded amounts that could not be recovered.
        player_id:
          type: string
          description: Empty when no player is bound (`paid`).
        created_at: {type: integer, format: int64}
        updated_at: {type: integer, format: int64}
        delivered_at: {type: integer, format: int64}
        refunded_at: {type: integer, format: int64}
        amount:
          type: integer
          format: int64
          description: Price fixed before payment in minor units (WeChat Pay, fen); absent when 0.
    CommerceOrderResult:
      type: object
      required: [order]
      properties:
        order: {$ref: '#/components/schemas/CommerceOrder'}
    CommerceWeChatPrepayRequest:
      type: object
      additionalProperties: false
      required: [order_id]
      properties:
        order_id: {type: string, maxLength: 64}
    CommerceWeChatPrepay:
      type: object
      required: [order_id, out_trade_no, amount, currency, payment]
      properties:
        order_id: {type: string}
        out_trade_no:
          type: string
          description: The order's app_account_token without dashes (32 hex characters).
        amount: {type: integer, format: int64, description: Price in fen.}
        currency: {type: string, enum: [CNY]}
        payment:
          type: object
          description: 'Parameters for wx.requestPayment. paySign is base64 RSA-SHA256 (merchant key) over "appId\ntimeStamp\nnonceStr\npackage\n".'
          required: [appId, timeStamp, nonceStr, package, signType, paySign]
          properties:
            appId: {type: string}
            timeStamp: {type: string}
            nonceStr: {type: string}
            package: {type: string, description: '`prepay_id=<prepay_id>`'}
            signType: {type: string, enum: [RSA]}
            paySign: {type: string}
    CommerceVerifyResult:
      type: object
      required: [order, replayed]
      properties:
        order: {$ref: '#/components/schemas/CommerceOrder'}
        replayed:
          type: boolean
          description: True when the transaction was already delivered to this player (nothing granted now).
    CommerceAppleNotification:
      type: object
      required: [signedPayload]
      description: App Store Server Notifications V2 body. Unknown fields are ignored.
      properties:
        signedPayload:
          type: string
          minLength: 1
          maxLength: 65536
    CommerceHmacAdCallback:
      type: object
      description: Form-encoded HMAC callback parameters (each parameter at most once). Extra parameters are allowed and are part of the signed canonical string.
      required: [event_id, token, ts, sig]
      properties:
        event_id: {type: string, maxLength: 128}
        token: {type: string, maxLength: 128}
        ts: {type: integer, format: int64}
        sig: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
      additionalProperties:
        type: string
    CommerceCallbackResult:
      type: object
      required: [status, duplicate, reason, order_id]
      properties:
        status:
          type: string
          enum: [processed, ignored]
        duplicate:
          type: boolean
          description: True when the event was already recorded; the recorded outcome is returned.
        reason:
          type: string
          description: Empty, or why the event was ignored (e.g. `unknown_token`, `token_used`, `token_expired`, `placement_removed`, `daily_cap_reached`, `transaction already delivered`, `awaiting client verification`).
        order_id:
          type: string
          description: Affected order id, empty when none.
    CommerceAdIntent:
      type: object
      required: [token, placement_id, expires_at]
      properties:
        token:
          type: string
          description: Opaque single-use intent token (`adt_` prefix).
        placement_id: {type: string}
        expires_at: {type: integer, format: int64}
    CommerceProductDef:
      type: object
      additionalProperties: false
      required: [grants]
      properties:
        grants: {$ref: '#/components/schemas/CommerceGrants'}
        provider_product_ids:
          type: object
          description: Configured provider (e.g. `apple`) → store product id (1–128 characters).
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 128
    CommerceProductCatalog:
      type: object
      description: Product id → definition; at most 500.
      maxProperties: 500
      propertyNames:
        pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
      additionalProperties: {$ref: '#/components/schemas/CommerceProductDef'}
    CommerceProductsResponse:
      type: object
      required: [products]
      properties:
        products: {$ref: '#/components/schemas/CommerceProductCatalog'}
    CommercePlacementDef:
      type: object
      additionalProperties: false
      required: [grants, daily_cap]
      properties:
        grants: {$ref: '#/components/schemas/CommerceGrants'}
        daily_cap:
          type: integer
          minimum: 1
          maximum: 1000
          description: Credited rewards per player per UTC day.
    CommercePlacementMap:
      type: object
      maxProperties: 500
      propertyNames:
        pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
      additionalProperties: {$ref: '#/components/schemas/CommercePlacementDef'}
    CommercePlacementsResponse:
      type: object
      required: [placements]
      properties:
        placements: {$ref: '#/components/schemas/CommercePlacementMap'}

    MatchCreateTicketRequest:
      type: object
      additionalProperties: false
      required: [queue]
      properties:
        queue:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
          description: Invalid or unknown queue ids get `404 not_found`.
        attributes:
          type: object
          additionalProperties: false
          properties:
            rating:
              type: integer
              format: int64
              minimum: -1000000
              maximum: 1000000
              default: 0
    MatchCreatedTicket:
      type: object
      required: [ticket_id, queue, status, expires_at]
      properties:
        ticket_id: {type: string}
        queue: {type: string}
        status:
          type: string
          enum: [waiting]
        expires_at: {type: integer, format: int64}
    MatchTicketStatus:
      type: string
      enum: [waiting, matched, expired, cancelled, abandoned, done]
    MatchMember:
      type: object
      required: [player_id, state]
      properties:
        player_id: {type: string}
        state:
          type: string
          enum: [assigned, connected, left]
    MatchRoom:
      type: object
      required: [room_id, status, lease_until, connection, members]
      properties:
        room_id: {type: string}
        status:
          type: string
          enum: [open, active, settled, abandoned]
        lease_until: {type: integer, format: int64}
        connection:
          description: '`null` until a battle server claims the room (and for abandoned rooms); then the object the server supplied.'
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: true
        members:
          type: array
          items: {$ref: '#/components/schemas/MatchMember'}
    MatchTicket:
      type: object
      required: [ticket_id, queue, status, rating, created_at, expires_at]
      properties:
        ticket_id: {type: string}
        queue: {type: string}
        status: {$ref: '#/components/schemas/MatchTicketStatus'}
        rating: {type: integer, format: int64}
        created_at: {type: integer, format: int64}
        expires_at: {type: integer, format: int64}
        room: {$ref: '#/components/schemas/MatchRoom'}
    MatchQueueRequest:
      type: object
      additionalProperties: false
      required: [size, rating_window, widen_per_sec, ttl]
      properties:
        size:
          type: integer
          minimum: 2
          maximum: 64
          description: Players per room.
        rating_window:
          type: integer
          format: int64
          minimum: 0
          maximum: 2000000
        widen_per_sec:
          type: integer
          format: int64
          minimum: 0
          maximum: 2000000
        max_window:
          type: integer
          format: int64
          minimum: 0
          maximum: 2000000
          default: 0
          description: 0 = uncapped.
        ttl:
          type: integer
          format: int64
          minimum: 5
          maximum: 3600
          description: Ticket lifetime in seconds.
        board:
          type: string
          default: ''
          description: Optional leaderboard receiving settlement scores; must exist in the current game config.
    MatchQueue:
      type: object
      required: [queue, size, rating_window, widen_per_sec, max_window, ttl, board]
      properties:
        queue: {type: string}
        size: {type: integer}
        rating_window: {type: integer, format: int64}
        widen_per_sec: {type: integer, format: int64}
        max_window: {type: integer, format: int64}
        ttl: {type: integer, format: int64}
        board: {type: string}
    MatchClaimRequest:
      type: object
      additionalProperties: false
      required: [server_id]
      properties:
        server_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
        game_id:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
          description: Optional filter (must belong to the key's tenant to match anything).
        queue:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
          description: Optional filter.
        connection:
          type: object
          additionalProperties: true
          description: Connection info shown to room members (≤ 1024 bytes JSON); defaults to `{}`.
    MatchClaimedRoom:
      type: object
      required: [room_id, game_id, queue, token, epoch, lease_until, lease_ttl_ms, members]
      properties:
        room_id: {type: string}
        game_id: {type: string}
        queue: {type: string}
        token:
          type: string
          description: Random room token for heartbeat/state/result, valid only together with the claiming API key. Returned once (and in an Idempotency-Key replay).
        epoch:
          type: integer
          format: int64
          description: Per-game claim counter (only grows); orders claims, not a credential.
        lease_until: {type: integer, format: int64}
        lease_ttl_ms: {type: integer, format: int64}
        members:
          type: array
          items: {$ref: '#/components/schemas/MatchMember'}
    MatchTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: Room token from claim; a token that is not the room's current token, or a key other than the claiming key, gets `409 stale_token`.
    MatchResultEntry:
      type: object
      additionalProperties: false
      required: [player_id]
      properties:
        player_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
        score:
          type: integer
          format: int64
          description: Requires a queue board; checked against the board's min/max score.
        grants:
          type: object
          maxProperties: 8
          propertyNames:
            pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
            maximum: 1000000000
    MatchResultRequest:
      type: object
      additionalProperties: false
      required: [token, results]
      properties:
        token:
          type: string
          description: Room token from claim; a token that is not the room's current token, or a key other than the claiming key, gets `409 stale_token`.
        results:
          type: array
          minItems: 1
          maxItems: 64
          description: Distinct room members.
          items: {$ref: '#/components/schemas/MatchResultEntry'}
    MatchResultResponse:
      type: object
      required: [room_id, status, results]
      properties:
        room_id: {type: string}
        status:
          type: string
          enum: [settled]
        results:
          type: array
          description: Sorted by player_id.
          items:
            type: object
            required: [player_id, granted]
            properties:
              player_id: {type: string}
              granted:
                $ref: '#/components/schemas/Balances'
                description: Non-zero grants applied.
              score_status:
                type: string
                enum: [accepted, quarantined]
              best:
                type: integer
                format: int64
                description: Current best/sum on the board (absent when quarantined without an existing score).

    SocialPrivacy:
      type: object
      required: [searchable, friend_requests, show_on_friend_boards]
      properties:
        searchable:
          type: boolean
          description: false hides the player from new requests unless they already requested the caller. Default true.
        friend_requests:
          type: string
          enum: [everyone, nobody]
        show_on_friend_boards:
          type: boolean
    SocialProfile:
      type: object
      required: [player_id, display_name, friend_code, privacy]
      properties:
        player_id: {type: string}
        display_name: {type: string, description: Empty until set.}
        friend_code: {type: string, pattern: '^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{8}$'}
        privacy: {$ref: '#/components/schemas/SocialPrivacy'}
    SocialProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 24
          description: 1–24 characters (runes) of letters, digits, space, `_`, `-`, `.`; no leading/trailing space.
        privacy:
          type: object
          additionalProperties: false
          properties:
            searchable: {type: boolean}
            friend_requests: {type: string, enum: [everyone, nobody]}
            show_on_friend_boards: {type: boolean}
    SocialPerson:
      type: object
      required: [player_id, display_name, at]
      properties:
        player_id: {type: string}
        display_name: {type: string}
        at: {type: integer, format: int64, description: Friendship or request creation time.}
    SocialFriendRequestBody:
      type: object
      additionalProperties: false
      description: Exactly one of `player_id` or `friend_code`.
      properties:
        player_id: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
        friend_code: {type: string}
    SocialRequestStatus:
      type: object
      required: [status, player_id]
      properties:
        status: {type: string, enum: [pending, accepted, declined, cancelled]}
        player_id: {type: string}
    SocialBlockResult:
      type: object
      required: [blocked, player_id]
      properties:
        blocked: {type: boolean}
        player_id: {type: string}
    SocialFriendBoard:
      type: object
      required: [board, season, entries]
      properties:
        board: {type: string}
        season: {type: string}
        entries:
          type: array
          items:
            type: object
            required: [rank, player_id, display_name, score, achieved_at, me]
            properties:
              rank: {type: integer, minimum: 1}
              player_id: {type: string}
              display_name: {type: string}
              score: {type: integer, format: int64}
              achieved_at: {type: integer, format: int64}
              me: {type: boolean}
    SocialInvite:
      type: object
      required: [code, created_at, accepted]
      properties:
        code: {type: string}
        created_at: {type: integer, format: int64}
        accepted: {type: integer, minimum: 0, description: Number of attributed invitees.}
    SocialShareId:
      type: string
      pattern: '^shr_[a-z0-9]{26}$'
    SocialShareCreate:
      type: object
      additionalProperties: false
      required: [channel]
      properties:
        channel: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'}
        payload:
          description: Any JSON value, at most 2048 bytes as sent; default `{}`.
    SocialShare:
      type: object
      required: [share_id, channel, payload, created_at, opens]
      properties:
        share_id: {$ref: '#/components/schemas/SocialShareId'}
        channel: {type: string}
        payload: {description: The JSON value stored at creation.}
        created_at: {type: integer, format: int64}
        opens: {type: integer, minimum: 0, description: Distinct opening players.}
    SocialShareOpen:
      type: object
      required: [share_id, channel, payload, first_open]
      properties:
        share_id: {$ref: '#/components/schemas/SocialShareId'}
        channel: {type: string}
        payload: {description: The JSON value stored at creation.}
        first_open: {type: boolean}

    WebAuthCredentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: Trimmed and lower-cased; exactly one `@`, non-empty local and domain parts, no whitespace/control characters. Unique per tenant.
        password:
          type: string
          description: 8..128 bytes (UTF-8 bytes, not characters). No normalization.
    WebAuthPasswordChange:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: {type: string}
        new_password: {type: string, description: 8..128 bytes.}
    WebAuthUser:
      type: object
      required: [id, tenant_id, email]
      properties:
        id: {type: string, description: '`usr_` + 26 base32 characters.'}
        tenant_id: {type: string}
        email: {type: string}
        created_at: {type: integer, format: int64, description: Present on signup and login; omitted by /me.}
    WebAuthSession:
      type: object
      required: [user, csrf_token, expires_at]
      properties:
        user: {$ref: '#/components/schemas/WebAuthUser'}
        csrf_token: {type: string, description: Send as `X-CSRF-Token` on unsafe requests.}
        expires_at: {type: integer, format: int64, description: Absolute session expiry (Unix ms); the idle timeout may end it earlier.}

    BillingAmountValue:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
      description: Integer minor units, 1..2^53-1.
    BillingNoteValue:
      type: string
      maxLength: 512
      description: At most 512 bytes.
    BillingCreateAccount:
      type: object
      additionalProperties: false
      required: [currency]
      properties:
        id:
          type: string
          pattern: '^[A-Za-z0-9_.:-]{1,64}$'
          description: Optional; empty or absent generates `acct_...`.
        currency:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,15}$'
    BillingAmount:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount: {$ref: '#/components/schemas/BillingAmountValue'}
        note: {$ref: '#/components/schemas/BillingNoteValue'}
    BillingAmountZero:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Actual charge, 0..reserved amount.
        note: {$ref: '#/components/schemas/BillingNoteValue'}
    BillingReserve:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount: {$ref: '#/components/schemas/BillingAmountValue'}
        ttl_seconds:
          type: integer
          minimum: 0
          maximum: 604800
          default: 0
          description: 0 or absent = 900 (15 min); otherwise 1..604800.
        note: {$ref: '#/components/schemas/BillingNoteValue'}
    BillingNote:
      type: object
      additionalProperties: false
      properties:
        note: {$ref: '#/components/schemas/BillingNoteValue'}
    BillingResolve:
      type: object
      additionalProperties: false
      required: [action, note]
      properties:
        action: {type: string, enum: [settle, release]}
        amount:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Charge for `settle` (≤ reserved); must be 0 for `release`.
        note:
          type: string
          minLength: 1
          maxLength: 512
          description: Required operator audit note.
    BillingAccount:
      type: object
      required: [tenant_id, id, currency, available, reserved, version, created_at, updated_at]
      properties:
        tenant_id: {type: string}
        id: {type: string}
        currency: {type: string}
        available: {type: integer, format: int64, minimum: 0}
        reserved: {type: integer, format: int64, minimum: 0}
        version: {type: integer, format: int64, description: Increments on every balance change.}
        created_at: {type: integer, format: int64}
        updated_at: {type: integer, format: int64}
    BillingEntry:
      type: object
      required: [id, account_id, type, amount, delta_available, delta_reserved, idempotency_key, created_at]
      properties:
        id: {type: string, description: '`le_...`'}
        account_id: {type: string}
        type: {type: string, enum: [credit, debit, reserve, settle, release, expire]}
        amount: {type: integer, format: int64, description: For settle the charged amount; for release/expire the returned amount.}
        delta_available: {type: integer, format: int64}
        delta_reserved: {type: integer, format: int64}
        reservation_id: {type: string}
        idempotency_key: {type: string, description: 'Caller key, or `sys:expire:<reservation>` for sweeper entries.'}
        note: {type: string}
        created_at: {type: integer, format: int64}
    BillingReservation:
      type: object
      required: [id, account_id, amount, status, expires_at, created_at, updated_at]
      properties:
        id: {type: string}
        account_id: {type: string}
        amount: {type: integer, format: int64}
        settled_amount: {type: integer, format: int64, description: Present when settled.}
        status: {type: string, enum: [reserved, settled, released, expired, reconciling]}
        expires_at: {type: integer, format: int64}
        note: {type: string}
        created_at: {type: integer, format: int64}
        updated_at: {type: integer, format: int64}
    BillingResult:
      type: object
      required: [account]
      properties:
        account: {$ref: '#/components/schemas/BillingAccount'}
        entry: {$ref: '#/components/schemas/BillingEntry'}
        reservation: {$ref: '#/components/schemas/BillingReservation'}
    BillingMismatch:
      type: object
      required: [tenant_id, account_id, field, stored, expected]
      properties:
        tenant_id: {type: string}
        account_id: {type: string}
        field: {type: string, enum: [available, reserved, open_reservations]}
        stored: {type: integer, format: int64}
        expected: {type: integer, format: int64}

    AgentRunStatus:
      type: string
      enum: [queued, running, waiting, succeeded, failed, cancelled, timed_out]
    AgentCreateRun:
      type: object
      required: [workflow]
      additionalProperties: false
      properties:
        workflow: {type: string, description: Name registered with `Hooks.Workflows` / `agent.Kit.Register`.}
        input: {description: Any JSON value (≤ 64 KiB).}
        max_steps: {type: integer, format: int64, minimum: 0}
        max_cost_units: {type: integer, format: int64, minimum: 0}
        timeout_seconds: {type: integer, format: int64, minimum: 0}
    AgentRun:
      type: object
      required: [id, workflow, status, input, max_steps, max_cost_units, steps_used, cost_units, deadline_at, cancel_requested, created_at, updated_at]
      properties:
        id: {type: string, description: '`run_...`'}
        workflow: {type: string}
        status: {$ref: '#/components/schemas/AgentRunStatus'}
        wait_reason: {type: string, enum: [sleep, reconciliation, concurrency], description: Why the run is waiting (or queued for `concurrency`).}
        input: {description: Run input (JSON).}
        output: {description: Output set by the workflow (JSON), on success.}
        error_code: {type: string, enum: [budget_exceeded, timed_out, cancelled, workflow_error, nondeterministic_workflow, unknown_workflow, output_too_large]}
        error: {type: string, description: Redacted, truncated to 1000 bytes.}
        max_steps: {type: integer, format: int64}
        max_cost_units: {type: integer, format: int64, description: 0 = unlimited.}
        steps_used: {type: integer, format: int64}
        cost_units: {type: integer, format: int64}
        deadline_at: {type: integer, format: int64}
        cancel_requested: {type: boolean}
        created_at: {type: integer, format: int64}
        updated_at: {type: integer, format: int64}
        finished_at: {type: integer, format: int64}
        steps:
          type: array
          items: {$ref: '#/components/schemas/AgentStep'}
    AgentStep:
      type: object
      required: [seq, name, kind, status, attempt, cost_units, output_bytes, started_at]
      properties:
        seq: {type: integer, format: int64}
        name: {type: string}
        kind: {type: string, enum: [llm, tool, wait]}
        status: {type: string, enum: [running, succeeded, failed, waiting, needs_reconciliation]}
        attempt: {type: integer, format: int64}
        tool: {type: string}
        idempotent: {type: boolean}
        cost_units: {type: integer, format: int64}
        output_ref: {type: string, description: Object storage key when the output exceeded `agent.inline_output_bytes`.}
        output_bytes: {type: integer, format: int64}
        wake_at: {type: integer, format: int64}
        error: {type: string}
        started_at: {type: integer, format: int64}
        finished_at: {type: integer, format: int64}
    AgentToolCall:
      type: object
      required: [id, seq, attempt, tool, idempotency_key, request_hash, outcome, created_at]
      properties:
        id: {type: string}
        seq: {type: integer, format: int64}
        attempt: {type: integer, format: int64}
        tool: {type: string}
        idempotency_key: {type: string, description: '`<run_id>:<seq>`, stable across attempts.'}
        request_hash: {type: string, description: SHA-256 hex of the request bytes (the request itself is not stored).}
        outcome: {type: string, enum: [started, succeeded, failed, unknown, retry, resolved_succeeded, resolved_failed]}
        external_ref: {type: string}
        error: {type: string}
        created_at: {type: integer, format: int64}
    WebSite:
      type: object
      required: [id, name, base_url]
      properties:
        id: {type: string, pattern: '^[a-z0-9-]{1,64}$'}
        tenant_id: {type: string, readOnly: true}
        name: {type: string}
        base_url: {type: string, format: uri}
        robots_disallow:
          type: array
          maxItems: 100
          items: {type: string, pattern: '^/'}
        created_at: {type: integer, format: int64, readOnly: true}
    WebSEO:
      type: object
      properties:
        title: {type: string, maxLength: 300}
        description: {type: string, maxLength: 1000}
        canonical_url: {type: string, format: uri}
        og_title: {type: string, maxLength: 300}
        og_description: {type: string, maxLength: 1000}
        og_image: {type: string, format: uri}
        noindex: {type: boolean}
    WebPageInput:
      type: object
      required: [slug, title]
      additionalProperties: false
      properties:
        kind: {type: string, enum: [page, post], description: Create only (default page).}
        slug: {type: string, pattern: '^[a-z0-9-]+(/[a-z0-9-]+)*$', maxLength: 200}
        title: {type: string, maxLength: 300}
        body: {type: string, description: ≤ 256 KiB.}
        seo: {$ref: '#/components/schemas/WebSEO'}
        expected_version: {type: integer, format: int64, description: Required for updates.}
    WebPageStatus:
      type: string
      enum: [draft, scheduled, published, archived]
    WebRevision:
      type: object
      required: [rev, title, body, seo, author, created_at]
      properties:
        rev: {type: integer, format: int64}
        title: {type: string}
        body: {type: string}
        seo: {$ref: '#/components/schemas/WebSEO'}
        author: {type: string, description: '`key:<id>` or `user:<id>`'}
        created_at: {type: integer, format: int64}
    WebPage:
      type: object
      required: [id, site_id, kind, slug, status, draft_revision, published_revision, scheduled_revision, version, created_at, updated_at]
      properties:
        id: {type: string}
        site_id: {type: string}
        kind: {type: string, enum: [page, post]}
        slug: {type: string}
        status: {$ref: '#/components/schemas/WebPageStatus'}
        draft_revision: {type: integer, format: int64}
        published_revision: {type: integer, format: int64, description: 0 = never published.}
        scheduled_revision: {type: integer, format: int64}
        publish_at: {type: integer, format: int64}
        published_at: {type: integer, format: int64}
        version: {type: integer, format: int64}
        created_at: {type: integer, format: int64}
        updated_at: {type: integer, format: int64}
        draft: {$ref: '#/components/schemas/WebRevision'}
    WebPublicPage:
      type: object
      required: [site, kind, slug, title, body, published_at, seo]
      properties:
        site: {type: string}
        kind: {type: string}
        slug: {type: string}
        title: {type: string}
        body: {type: string}
        published_at: {type: integer, format: int64}
        seo: {$ref: '#/components/schemas/WebSEO'}
    WebOrderStatus:
      type: string
      enum: [created, paid, fulfilled, cancelled, refunded]
    WebOrder:
      type: object
      required: [id, status, account_id, amount, currency, customer_ref, items, version, created_at, updated_at]
      properties:
        id: {type: string}
        status: {$ref: '#/components/schemas/WebOrderStatus'}
        account_id: {type: string}
        amount: {type: integer, format: int64}
        currency: {type: string}
        customer_ref: {type: string}
        items: {description: JSON supplied at creation.}
        reservation_id: {type: string}
        version: {type: integer, format: int64}
        created_at: {type: integer, format: int64}
        updated_at: {type: integer, format: int64}
    WebEventType:
      type: string
      enum: [order.created, order.paid, order.fulfilled, order.cancelled, order.refunded]
    WebEvent:
      type: object
      required: [id, type, order_id, from_status, to_status, created_at, data]
      properties:
        id: {type: string, description: '`evt_...`; also the `GoStack-Webhook-Id` header.'}
        type: {$ref: '#/components/schemas/WebEventType'}
        order_id: {type: string}
        from_status: {type: string}
        to_status: {type: string}
        created_at: {type: integer, format: int64}
        data: {$ref: '#/components/schemas/WebOrder'}
    WebWebhook:
      type: object
      required: [id, url, events, active, created_at]
      properties:
        id: {type: string}
        url: {type: string}
        events:
          type: array
          items: {$ref: '#/components/schemas/WebEventType'}
        active: {type: boolean}
        secret: {type: string, description: Only in the creation response.}
        created_at: {type: integer, format: int64}
    WebDelivery:
      type: object
      required: [event_id, webhook_id, status, attempts, last_status, created_at, updated_at]
      properties:
        event_id: {type: string}
        webhook_id: {type: string}
        status: {type: string, enum: [pending, delivered, failed]}
        attempts: {type: integer, format: int64}
        last_status: {type: integer, format: int64, description: Last HTTP status (0 = network error).}
        last_error: {type: string}
        created_at: {type: integer, format: int64}
        updated_at: {type: integer, format: int64}
        delivered_at: {type: integer, format: int64}
