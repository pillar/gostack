# GoStack profile scale: continuous WAL archiving for point-in-time recovery.
# Include it from postgresql.conf (include_if_exists = 'gostack-pitr.conf') or
# copy the settings. archive_mode needs a server restart; the rest reloads.
# See docs/DISASTER_RECOVERY.md ("PostgreSQL").
#
# Replace /opt/gostack/deploy/postgres and /var/lib/postgresql/wal-archive with
# your paths. The archive directory must be writable by the postgres user and
# should live on storage that survives the loss of this machine (another disk
# or host). In production prefer pgBackRest or WAL-G (archive-push to S3/R2,
# retention, parallel restore) over wal-archive.sh; GoStack does not depend on
# either.

wal_level = replica                 # default; 'minimal' cannot be archived
archive_mode = on
archive_command = '/opt/gostack/deploy/postgres/wal-archive.sh %p %f /var/lib/postgresql/wal-archive'
# Upper bound on how long a partly filled WAL segment waits before it is
# switched and archived when traffic is low: it bounds RPO for a lost machine
# under light load (under heavy load the 16 MB segments fill sooner). Every
# forced switch archives a full 16 MB file, so small values cost archive space.
archive_timeout = 60s
max_wal_senders = 10                # pg_basebackup -X stream uses 2
# Keep the defaults fsync = on, full_page_writes = on, synchronous_commit = on.
